<style>
:root{
  --bg:#0b0f1a; --bg2:#121a2e; --glass:rgba(255,255,255,.06); --glass2:rgba(255,255,255,.1);
  --border:rgba(255,255,255,.12); --text:#e8ecf6; --muted:#9aa6c2; --accent:#7c9cff; --accent2:#b38cff;
  --good:#46d39a; --warn:#ffc35c; --bad:#ff7a8a; --chip:rgba(124,156,255,.16); --shadow:0 10px 30px rgba(0,0,0,.35);
  --u1:#5ec8ff; --u2:#7c9cff; --u3:#b38cff; --u4:#ff8fc7; --u5:#ffb366; --u6:#5fe0b2; --u7:#ffd95e; --u8:#9aa6c2;
}
[data-theme="light"] header.top{background:rgba(238,242,251,.86)}
[data-theme="light"]{
  --bg:#eef2fb; --bg2:#ffffff; --glass:rgba(255,255,255,.72); --glass2:rgba(255,255,255,.9);
  --border:rgba(20,30,60,.12); --text:#16203a; --muted:#56627e; --accent:#3d5ce6; --accent2:#7a4ee0;
  --chip:rgba(61,92,230,.1); --shadow:0 8px 24px rgba(30,40,80,.12);
  --u1:#0a8fd1; --u2:#3d5ce6; --u3:#7a4ee0; --u4:#d13d8a; --u5:#d07714; --u6:#13a37a; --u7:#b08900; --u8:#56627e;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;overflow-x:hidden;
  background-image:radial-gradient(1200px 600px at 10% -10%,rgba(124,156,255,.18),transparent 60%),radial-gradient(900px 500px at 100% 0%,rgba(179,140,255,.14),transparent 60%);background-attachment:fixed}
a{color:var(--accent)}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:rgba(11,15,26,.82);border-bottom:1px solid var(--border)}
.bar{display:flex;align-items:center;gap:10px;padding:10px 0}
.brand{font-weight:800;letter-spacing:.2px;white-space:nowrap;font-size:15px}
.brand span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.search{flex:1;min-width:0;position:relative}
.search input{width:100%;padding:10px 36px 10px 14px;border-radius:12px;border:1px solid var(--border);background:var(--glass);color:var(--text);font-size:16px;outline:none}
.search input:focus{border-color:var(--accent)}
.search button{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);font-size:18px;width:32px;height:32px;cursor:pointer;border-radius:8px}
.iconbtn{border:1px solid var(--border);background:var(--glass);color:var(--text);border-radius:12px;min-width:44px;height:42px;font-size:18px;cursor:pointer}
nav.links{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
nav.links::-webkit-scrollbar{display:none}
nav.links a{flex:0 0 auto;text-decoration:none;color:var(--muted);padding:8px 12px;border-radius:999px;border:1px solid var(--border);background:var(--glass);font-size:13.5px;font-weight:600;white-space:nowrap}
nav.links a.active{color:#fff;background:linear-gradient(90deg,var(--accent),var(--accent2));border-color:transparent}
#searchinfo{font-size:13px;color:var(--muted);padding:0 0 8px;display:none}
section{scroll-margin-top:120px;padding:26px 0 8px}
h1{font-size:clamp(26px,5vw,40px);line-height:1.15;margin:18px 0 8px}
h2{font-size:clamp(21px,3.6vw,28px);margin:0 0 6px}
h3{font-size:18px;margin:18px 0 8px}
.sub{color:var(--muted);margin:0 0 14px}
.glass{background:var(--glass);border:1px solid var(--border);border-radius:18px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:var(--shadow)}
.hero{padding:22px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:14px}
.stat{padding:14px;border-radius:14px;background:var(--glass2);border:1px solid var(--border)}
.stat b{display:block;font-size:26px}
.stat span{color:var(--muted);font-size:13px}
.note{padding:12px 14px;border-radius:14px;border:1px solid var(--border);background:var(--chip);font-size:14px;margin:12px 0}
.note.warn{background:rgba(255,195,92,.12);border-color:rgba(255,195,92,.4)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}
.btn{border:1px solid var(--border);background:var(--glass);color:var(--text);padding:9px 14px;border-radius:12px;font-weight:600;font-size:14px;cursor:pointer;min-height:42px}
.btn.on{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
details.q{border:1px solid var(--border);background:var(--glass);border-radius:16px;margin:10px 0;overflow:hidden;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
details.q[open]{background:var(--glass2)}
details.q>summary{list-style:none;cursor:pointer;padding:14px 46px 14px 14px;position:relative;-webkit-tap-highlight-color:transparent}
details.q>summary::-webkit-details-marker{display:none}
details.q>summary::after{content:"";position:absolute;right:16px;top:20px;width:10px;height:10px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:rotate(45deg);transition:transform .2s}
details.q[open]>summary::after{transform:rotate(-135deg);top:24px}
.qt{font-weight:700;font-size:15.5px;display:block;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--text);border:1px solid var(--border);white-space:nowrap}
.chip.freq{background:linear-gradient(90deg,rgba(124,156,255,.35),rgba(179,140,255,.35))}
.chip.hot{background:rgba(255,122,138,.18);border-color:rgba(255,122,138,.45)}
.chip.unit{border-left:4px solid var(--uc,var(--accent))}
.chip.y{font-weight:500;color:var(--muted)}
.body{padding:0 14px 14px;border-top:1px dashed var(--border)}
.body h4{margin:12px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.asked{margin:0;padding-left:0;list-style:none;font-size:13.5px}
.asked li{padding:6px 0;border-bottom:1px solid var(--border);overflow-wrap:anywhere}
.asked li b{color:var(--accent)}
ul.ans{margin:6px 0 0;padding-left:20px}
ul.ans li{margin:5px 0;overflow-wrap:anywhere}
.tbl{overflow-x:auto;margin:8px 0;border-radius:10px;border:1px solid var(--border)}
.tbl table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:420px}
.tbl th,.tbl td{padding:7px 9px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
.tbl th{background:var(--chip)}
.unithead{display:flex;align-items:center;gap:10px;margin:28px 0 4px}
.unithead .dot{width:12px;height:12px;border-radius:50%;background:var(--uc)}
.unithead h3{margin:0}
.unithead small{color:var(--muted)}
.rank{display:inline-grid;place-items:center;min-width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:800;font-size:13px;margin-right:8px;vertical-align:middle}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.card{padding:14px;border-radius:16px;border:1px solid var(--border);background:var(--glass)}
.card h4{margin:0 0 6px;font-size:15px}
.card p{margin:0;font-size:14px;color:var(--text)}
.card ul{margin:6px 0 0;padding-left:18px;font-size:14px}
.card ul li{margin:4px 0}
.reveal{margin-top:10px;border:1px solid var(--border);border-radius:12px;background:var(--glass)}
.reveal>summary{cursor:pointer;padding:10px 12px;font-weight:700;color:var(--accent);list-style:none}
.reveal>summary::-webkit-details-marker{display:none}
.reveal>summary::before{content:"▶ ";font-size:11px}
.reveal[open]>summary::before{content:"▼ "}
.reveal>div{padding:0 12px 10px}
.why{font-size:14px;color:var(--muted);margin-top:10px}
.conf-Very{background:rgba(70,211,154,.2);border-color:rgba(70,211,154,.5)}
.conf-High{background:rgba(70,211,154,.13)}
.conf-Medium{background:rgba(255,195,92,.15)}
.conf-Low{background:rgba(255,122,138,.13)}
.bars{display:grid;gap:8px}
.barrow{display:grid;grid-template-columns:minmax(90px,170px) 1fr 44px;align-items:center;gap:8px;font-size:13.5px}
.barrow .track{height:14px;border-radius:999px;background:var(--glass2);overflow:hidden;border:1px solid var(--border)}
.barrow .fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.barrow .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.heat td{text-align:center;font-weight:700;min-width:34px}
.heat th:first-child,.heat td:first-child{text-align:left;white-space:nowrap}
.linklist{list-style:none;padding:0;margin:0}
.linklist li{padding:9px 0;border-bottom:1px solid var(--border);font-size:14.5px}
.linklist a{text-decoration:none;color:var(--text);font-weight:600}
.linklist a:hover{color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.hidden{display:none!important}
footer{color:var(--muted);font-size:13px;padding:30px 0 60px;text-align:center}
#totop{position:fixed;right:14px;bottom:16px;z-index:60;width:46px;height:46px;border-radius:14px;border:1px solid var(--border);background:var(--glass2);color:var(--text);font-size:20px;cursor:pointer;box-shadow:var(--shadow);backdrop-filter:blur(10px);display:none}
mark{background:rgba(255,217,94,.45);color:inherit;border-radius:3px;padding:0 1px}
@media (max-width:720px){
  .two{grid-template-columns:1fr}
  .brand{display:none}
  section{scroll-margin-top:112px}
  .hero{padding:16px}
  .qt{font-size:15px}
  .barrow{grid-template-columns:minmax(70px,110px) 1fr 36px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>

<script id="data" type="application/json">{"papers": [{"code": "D13", "label": "Dec 2013 Final", "kind": "Final", "sort": 2013.9, "max": 100, "pages": "27-28"}, {"code": "J14", "label": "Jun 2014 Re-exam", "kind": "Re-exam", "sort": 2014.4, "max": 100, "pages": "29-30"}, {"code": "D14", "label": "Dec 2014 Final", "kind": "Final", "sort": 2014.9, "max": 100, "pages": "20-21"}, {"code": "D14R", "label": "Dec 2014 Re-exam", "kind": "Re-exam", "sort": 2014.91, "max": null, "pages": "22"}, {"code": "J15", "label": "Jun 2015 Re-exam", "kind": "Re-exam", "sort": 2015.4, "max": 60, "pages": "31"}, {"code": "D15", "label": "Dec 2015 Final", "kind": "Final", "sort": 2015.9, "max": 60, "pages": "25-26"}, {"code": "D16", "label": "Dec 2016 Final", "kind": "Final", "sort": 2016.9, "max": null, "pages": "23-24"}, {"code": "D16R", "label": "Dec 2016 Re-exam", "kind": "Re-exam", "sort": 2016.91, "max": 60, "pages": "3-4"}, {"code": "M17", "label": "May 2017 Re-exam", "kind": "Re-exam", "sort": 2017.4, "max": 60, "pages": "42-45"}, {"code": "N17", "label": "Nov 2017 Final", "kind": "Final", "sort": 2017.9, "max": 70, "pages": "40-41"}, {"code": "N18", "label": "Nov 2018 Final", "kind": "Final", "sort": 2018.9, "max": 70, "pages": "36-37"}, {"code": "J19", "label": "Jan 2019 Re-exam", "kind": "Re-exam", "sort": 2019.05, "max": null, "pages": "32"}, {"code": "N19", "label": "Nov 2019 Final", "kind": "Final", "sort": 2019.9, "max": null, "pages": "38-39"}, {"code": "N22", "label": "Nov 2022 Final", "kind": "Final", "sort": 2022.9, "max": 100, "pages": "7-8, 11-12"}, {"code": "J23", "label": "Jan 2023 Re-exam", "kind": "Re-exam", "sort": 2023.05, "max": 100, "pages": "9-10"}, {"code": "N23", "label": "Nov 2023 Final", "kind": "Final", "sort": 2023.9, "max": 100, "pages": "46-47"}, {"code": "F24", "label": "Feb 2024 Re-exam", "kind": "Re-exam", "sort": 2024.1, "max": 100, "pages": "1-2, 5-6"}, {"code": "D24", "label": "Dec 2024 Final", "kind": "Final", "sort": 2024.93, "max": 100, "pages": "33-35"}, {"code": "R25", "label": "Re-exam 2024-25", "kind": "Re-exam", "sort": 2025.2, "max": 100, "pages": "13-15"}, {"code": "D25", "label": "Dec 2025 Final", "kind": "Final", "sort": 2025.93, "max": 100, "pages": "17-19"}], "units": {"1": "Introduction to Software Engineering", "2": "Software Development Life Cycle", "3": "UML Modeling", "4": "Requirement Analysis & Design", "5": "Architectural Design", "6": "User Interface Design", "7": "Testing Strategies & Software Quality", "8": "Other (older syllabus: estimation, SCM, risk, project mgmt)"}, "groups": [{"unit": 1, "title": "Software characteristics (and comparison with hardware)", "kind": "theory", "occ": [["J15", null, "What are software characteristics? Explain in brief."], ["J19", 7, "Explain the three characteristics of software; which prescriptive model is suitable for business applications and why?"], ["N19", null, "Short note: Characteristics of software"], ["N23", 10, "Explain the characteristics of the software in detail and compare with hardware."]], "ans": ["**Software is developed/engineered, not manufactured** – cost is in engineering, not production.", "**Software doesn't wear out** – it deteriorates due to change (failure curve has spikes after each change; hardware follows the 'bathtub curve').", "**Mostly custom-built** – though component reuse is increasing.", "Other traits: intangible, complex, easy to change (but changes add defects), no spare parts – maintenance means changing design/code.", "**Hardware vs software:** hardware is physical, manufactured, wears out (dust, heat, vibration), replaced with spare parts; software is logical, engineered, deteriorates through changes.", "J19 add-on: for business applications a **waterfall/incremental** model fits when requirements are well understood and stable."], "dia": null}, {"unit": 1, "title": "Software deterioration vs hardware wear-out", "kind": "comparison", "occ": [["D24", 5, "How does software deterioration differ from hardware wear out; what factors contribute to software deterioration?"]], "ans": ["**Hardware:** bathtub curve – high early failures (defects), low steady rate, then rises again as parts wear out (heat, dust, vibration).", "**Software:** idealized curve flattens after early defects are fixed; it never wears out.", "**Actual software curve:** every change introduces side-effect defects → spikes; minimum failure rate slowly rises = **deterioration**.", "**Factors:** frequent changes/patches, poor documentation, design erosion, changing environment (OS, hardware, libraries), loss of original developers, accumulated technical debt."], "dia": null}, {"unit": 1, "title": "Program vs software; importance of software engineering", "kind": "comparison", "occ": [["D15", null, "Differentiate software versus program and describe importance of Software Engineering"], ["D16", null, "Differentiate between a Program and Software. Why legacy software need to be evolved?"], ["J14", null, "Why is software engineering important?"], ["D14R", null, "Why is software engineering important?"]], "ans": ["**Program:** set of instructions written by one person for a specific task; small, little/no documentation, developer is the user.", "**Software:** program + documentation + operating procedures + data; large, many users, needs a defined process and maintenance.", "**Why SE matters:** builds reliable, quality software on time & within budget; manages complexity of large systems; reduces cost of maintenance; enables teamwork, reuse and change management.", "Legacy evolution (D16): adapt to new environments/technology, add new business requirements, interoperate with modern systems/databases, re-architect for networks."], "dia": null}, {"unit": 1, "title": "Legacy software – concept and challenges in maintaining it", "kind": "theory", "occ": [["N22", 5, "Explain the concept of Legacy Software."], ["D25", 5, "Explain challenges in maintaining Legacy software."], ["D16", null, "Why legacy software need to be evolved? (with program vs software)"]], "ans": ["**Legacy software:** older programs developed decades ago, still business-critical, continually modified to meet changing needs.", "Often has **poor quality**: inextensible design, convoluted code, poor/no documentation, test cases never archived, poorly managed change history.", "**Challenges:** original developers gone, outdated languages/platforms, high risk of side-effects when changing, costly to integrate with new systems, lack of tests.", "**Why it evolves:** adapt to new computing environments, implement new business requirements, interoperate with modern systems, re-architect for network/cloud."], "dia": null}, {"unit": 1, "title": "Software myths (management, customer, practitioner) and reality", "kind": "theory", "occ": [["D13", 5, "What are myths and reality from the perspective of practitioners."], ["J14", null, "What are the myths and reality from the perspective of practitioners."], ["D14", 10, "Discuss on Software Myths – explain the different types of Software Myths."]], "ans": ["**Management myths:** 'We have a book of standards, so that's enough' → reality: standards often unused/outdated. 'Add more programmers if late' → adding people makes a late project later (Brooks).", "**Customer myths:** 'A general statement of objectives is enough to start coding' → poor requirements cause failure. 'Requirements change easily because software is flexible' → late change costs far more.", "**Practitioner myths:** 'Once the program works, our job is done' → 60–80% effort comes after first delivery. 'Can't assess quality until it runs' → technical reviews find defects early. 'Only deliverable is the working program' → documentation, models, plans also delivered. 'SE creates unnecessary documentation' → SE is about quality, reducing rework."], "dia": null}, {"unit": 1, "title": "True/False myth questions (requirements change easily; quality cannot be assessed until running)", "kind": "theory", "occ": [["N22", 5, "\"Until the software developer gets the program 'running' there is no way of assessing its quality\" – True or False with justification."], ["J23", 5, "\"Software requirements continually change, but change can be easily accommodated because software is flexible\" – True or False with justification."]], "ans": ["Both statements are **FALSE** – they are classic software myths.", "**Quality myth:** quality can be assessed from the start using **technical reviews, inspections, walkthroughs, static analysis** of requirements and design; these find defects before coding.", "**Change myth:** impact of change depends on **when** it is introduced – cheap during requirements, very costly after design/coding/release (cost grows by orders of magnitude).", "Conclude with: SE practices (reviews, change control/SCM) are needed precisely because these myths are false."], "dia": null}, {"unit": 1, "title": "Categories of software with examples; generic vs customized products", "kind": "theory", "occ": [["J14", null, "What are different categories of software? State example of each category."], ["D14R", null, "What are different categories of software? State example of each category."], ["F24", 5, "Distinguish between generic and customized software products. Which one would generate more revenue for a company? Give reasons."]], "ans": ["**Categories:** System software (OS, compilers), Application software (payroll, billing), Engineering/scientific (CAD, simulation), Embedded (washing machine, car ABS), Product-line (word processors, spreadsheets), Web/mobile apps (e-commerce, banking app), AI software (expert systems, neural nets).", "**Generic product:** built for an open market; developer owns the specification (e.g., MS Office, Photoshop).", "**Customized product:** built for a specific customer; customer owns the specification (e.g., bank's core system, hospital system).", "**Revenue:** generic can earn more via scale – one build sold to many customers, licences/subscriptions; customized gives fixed but assured revenue per contract and higher per-project price. Justify either with reasons."], "dia": null}, {"unit": 1, "title": "Generic process framework activities and umbrella activities", "kind": "theory", "occ": [["D15", null, "List generic software process activities and umbrella activities"], ["N17", 5, "Discuss the process framework and umbrella activities."]], "ans": ["**Framework activities:** Communication, Planning, Modeling (analysis & design), Construction (code & test), Deployment.", "**Umbrella activities:** Software project tracking & control, Risk management, Software quality assurance, Technical reviews, Measurement, Software configuration management, Reusability management, Work product preparation & production.", "Umbrella activities run **throughout** the project and support every framework activity."], "dia": null}, {"unit": 1, "title": "SE practices that improve system reliability", "kind": "theory", "occ": [["R25", 5, "Explain how software engineering practices contribute to improving system reliability. Key practices that influence reliability?"]], "ans": ["**Reliability** = probability of failure-free operation for a specified time in a specified environment.", "Clear requirements & reviews → fewer defects introduced.", "Good design: modularity, high cohesion/low coupling, fault-tolerant design, error handling.", "Testing at all levels (unit, integration, system, regression) + code reviews/static analysis.", "SQA, configuration management, metrics (MTBF, defect density) and continuous monitoring."], "dia": null}, {"unit": 2, "title": "Waterfall model – phases, prescriptive nature, design phase, rigidity & risk", "kind": "theory", "occ": [["D25", 10, "Describe the main phases of the Waterfall Model and explain why it is considered a prescriptive process model."], ["R25", 10, "How does the design phase in the Waterfall Model influence the success of subsequent phases? Importance of comprehensive design before implementation."], ["D24", 10, "Analyze the impact of the Waterfall Model's rigid phase progression on project risk management; lack of iteration and early issue detection."]], "ans": ["**Phases:** Communication (requirements) → Planning → Modeling (analysis & design) → Construction (code & test) → Deployment (delivery, support). Each phase finishes before the next begins (linear sequential).", "**Prescriptive:** it prescribes a fixed set of activities, work products, order and milestones – a defined 'recipe' for development.", "**Design phase influence:** design is the blueprint – architecture, data, interfaces; errors in design flow into code & testing and are very costly to fix later; complete design enables accurate estimation, parallel coding, test planning.", "**Rigidity & risk:** no iteration → requirement/design errors discovered only at testing; customer sees working product very late; high risk for uncertain or changing requirements.", "**Suitable when** requirements are well understood and stable (e.g., enhancements to existing systems)."], "dia": "Waterfall model diagram"}, {"unit": 2, "title": "Incremental process model (with diagram, example, advantages)", "kind": "theory", "occ": [["D13", 10, "Short note: Incremental Process model"], ["J14", null, "Short note: Incremental Process model"], ["D16R", null, "Incremental process models considered the best approach in a modern context? Do you agree? Justify."], ["M17", 6, "With suitable example scenario, describe the incremental model of software development."], ["N18", 7, "Explain incremental model with a neat diagram; advantages of incremental model over prototype model."], ["N22", 10, "Explain incremental software process model with neat diagram. State example application."]], "ans": ["Combines **linear sequential flows applied in a staggered way**; each linear sequence produces a deliverable **increment**.", "First increment = **core product** (basic requirements); later increments add features based on customer feedback.", "Diagram: several waterfall sequences (Communication → Planning → Modeling → Construction → Deployment) shifted along the time axis, labelled increment #1, #2, … #n.", "**Advantages:** early working software, easier testing of small increments, customer feedback, less risk, useful when staff is limited.", "**Over prototype:** each increment is an operational product (not thrown away), planned delivery.", "**Example:** word processor – inc 1 basic editing, inc 2 spelling/grammar, inc 3 advanced layout; e-commerce – catalogue, then cart, then payments.", "Modern context (D16R): **agree** – supports early delivery and change, basis of agile; but needs good architecture up-front."], "dia": "Incremental model diagram"}, {"unit": 2, "title": "Prototyping model (advantages, disadvantages, vs waterfall)", "kind": "theory", "occ": [["D16", null, "What is prototyping? How is the prototype model useful? Advantages and disadvantages."], ["N19", 3, "How the prototype model solve the problems over waterfall model?"], ["D14", 10, "Differentiate between the Prototype and Spiral model. Also discuss the advantages and disadvantages."]], "ans": ["Used when customer has general objectives but **unclear detailed requirements**.", "Cycle: Communication → Quick plan → Quick design (modeling) → Construction of prototype → Deployment, delivery & feedback → refine.", "**Advantages:** clarifies requirements, user involvement, early detection of missing functions, reduces risk of wrong product.", "**Disadvantages:** customer may treat prototype as final product, quick-and-dirty implementation choices remain, cost of throwaway work.", "**Over waterfall:** waterfall needs all requirements up-front and shows the product late; prototyping gives early visible model and feedback.", "**Prototype vs spiral (D14):** prototyping focuses on clarifying requirements via quick models; spiral is risk-driven, iterates through planning–risk analysis–engineering–evaluation and may use prototypes inside loops; spiral suits large high-risk projects, prototyping suits unclear requirements."], "dia": "Prototyping model diagram"}, {"unit": 2, "title": "Spiral model – diagram, meta model, loops, risk handling", "kind": "theory", "occ": [["D13", 10, "Explain spiral model with neat diagram."], ["N17", null, "Which process model is best suited for risk management? Discuss with example; advantages and disadvantages."], ["N18", 7, "Short note: Spiral Model"], ["N19", null, "Explain the working of Spiral Model. Why spiral model is considered a meta model."], ["J23", 10, "Explain spiral software process model with neat diagram. State the drawbacks."], ["F24", 5, "Why the spiral model is considered as meta model?"], ["F24", 10, "Explain spiral model with schematic diagram; when beneficial; is the number of loops fixed?"], ["D24", 10, "Spiral Model for a new innovative technology with uncertainty – activities in each spiral, how it mitigates risk."]], "ans": ["Proposed by **Boehm**; **risk-driven**, evolutionary model combining iterative prototyping with controlled waterfall steps.", "Each loop has 4 quadrants: **Objective setting → Risk assessment & reduction (prototype) → Development & validation → Planning next phase**.", "Inner loops: concept/requirements; later loops: design, code, test, deployment; anchor point milestones at each pass.", "**Meta model:** it contains/subsumes other models – a single loop = waterfall, iterative loops = incremental/evolutionary, risk prototypes = prototyping.", "**Loops not fixed:** number decided by project risk and the result of risk analysis – the project manager adjusts loops per iteration.", "**Advantages:** best for large, high-risk projects; risk reduced early; customer evaluation each loop.", "**Drawbacks:** needs risk-assessment expertise, costly, hard to convince customers it is controllable, not for small projects.", "**Innovative tech:** loop 1 feasibility & proof-of-concept prototype; loop 2 requirements + tech prototype; loop 3 design & build core; loop 4 test & deploy – risks reviewed each loop."], "dia": "Spiral model diagram"}, {"unit": 2, "title": "RAD model – phases, time box, faster development, RAD vs prototyping/incremental", "kind": "theory", "occ": [["D14R", null, "Compare RAD Model and Spiral Model."], ["D15", null, "How will you apply RAD process model to develop software for Student Admission System (XI Std)?"], ["F24", 10, "RAD: life cycle activities; how RAD helps faster development; time box; RAD vs prototyping; schematic diagram."], ["D24", 10, "Effectiveness of RAD where time-to-market is critical; fast prototyping and parallel development vs Incremental model in quality and delivery speed."], ["D25", 5, "Compare the Incremental and RAD models in terms of development speed, modularity and project size suitability."]], "ans": ["**RAD** = incremental model with **very short cycle (60–90 days)** using component-based construction and parallel teams.", "**Phases:** Communication → Planning → Modeling (business, data, process modeling) → Construction (component reuse, automatic code generation, testing) → Deployment; multiple teams work on modules in parallel.", "**Time box:** fixed period (e.g., 90 days) in which a module must be delivered; scope is cut, not the deadline.", "**Faster because:** reusable components, CASE/auto code generation, parallel teams, strong user involvement, short iterations.", "**RAD vs prototyping:** RAD delivers working components into the final system; prototypes are often thrown away; RAD uses parallel teams and time boxes.", "**RAD vs incremental:** RAD faster (parallel teams), highly modular, needs large teams & good modularization; incremental slower but suits small/medium teams and evolving requirements.", "**RAD vs spiral:** RAD focuses on speed, spiral on risk; spiral suits high-risk large projects.", "**Limitations:** needs many skilled people, not for high technical risk or non-modular systems."], "dia": "RAD model schematic diagram"}, {"unit": 2, "title": "Evolutionary process models; choosing a model for a given system", "kind": "theory", "occ": [["J15", null, "What is evolutionary software development? List the evolutionary process models; explain one in detail."], ["J19", 7, "Which evolutionary process model is suitable for 'amazon.com online shopping system'? Explain with neat diagram."], ["D15", null, "Which process model will be preferred for web application for online jewelry shop? Justify."], ["N23", 10, "SBI accounting software: very large, security needed, high technical risk – identify the most appropriate life cycle and explain with diagram."]], "ans": ["**Evolutionary models** are iterative – produce increasingly complete versions: **Prototyping, Spiral, Concurrent development model** (also incremental is often listed).", "Choose by: requirement clarity, risk, size, time-to-market, customer involvement.", "**Large + high technical risk + security (SBI)** → **Spiral model** – risk analysis every loop, prototypes for security, phased delivery.", "**Online shop (amazon / jewelry)** → **Incremental/Spiral or Agile** – core catalogue + cart first, features added in increments; requirements evolve with market.", "Always draw the chosen model's diagram and justify with 3–4 points."], "dia": "Chosen process model diagram"}, {"unit": 2, "title": "Agile process – principles, agility, why use agile, three key assumptions", "kind": "theory", "occ": [["D14", 10, "What is Agility? Differentiate between XP and SCRUM."], ["D14R", null, "Why do we use Agile process models? Explain any two Agile process models."], ["J15", null, "What is Agile process? Explain any one agile model in detail."], ["D16R", null, "Three key assumptions every agile process must address. Explain refactoring, spike solutions and JAD."], ["N23", 5, "Discuss the principles of Agile method."], ["R25", 10, "Agile principle 'Welcoming changing requirements, even late in development' – impact on timelines and quality."]], "ans": ["**Agility:** ability to respond effectively to change; customer collaboration, small teams, incremental delivery, working software over documentation.", "**Three assumptions:** (1) hard to predict which requirements will persist/change; (2) design and construction are interleaved; (3) analysis, design, construction, testing are not predictable.", "**Key principles (12):** customer satisfaction by early & continuous delivery; welcome changing requirements; deliver working software frequently (weeks); business people & developers work together daily; motivated individuals; face-to-face communication; working software = measure of progress; sustainable pace; technical excellence; simplicity; self-organizing teams; regular reflection & tuning.", "**Welcoming change:** short iterations & backlog re-prioritisation absorb change; timeline is fixed per sprint but scope varies; quality improves (product matches real needs) if supported by continuous testing/refactoring; risk: scope creep, technical debt if not controlled.", "**Models:** XP, Scrum, ASD, DSDM, Crystal, FDD, Lean."], "dia": null}, {"unit": 2, "title": "Agile vs traditional (plan-driven) development", "kind": "comparison", "occ": [["N22", 10, "Differentiate between agile software development and traditional software process models."], ["N19", 4, "What is the difference between traditional software development method and agile method?"], ["D25", 10, "Compare Agile and plan-driven approaches in terms of specification and delivery; justify situations where Agile is more effective."]], "ans": ["| Aspect | Traditional / plan-driven | Agile |", "| Requirements | Fixed, fully specified up-front | Evolving, captured as user stories/backlog |", "| Delivery | One final delivery | Frequent increments (1–4 week sprints) |", "| Customer | Involved at start and end | Continuous collaboration |", "| Documentation | Heavy | Just enough |", "| Change | Costly, controlled | Welcomed |", "| Team | Hierarchical, large | Small, self-organizing |", "**Agile more effective:** unclear/changing requirements, fast time-to-market, small co-located teams, startups/web/mobile apps. Plan-driven better for safety-critical, regulated, fixed-contract large systems."], "dia": null}, {"unit": 2, "title": "Extreme Programming (XP) – process, principles, coding, refactoring, pair programming, spike, velocity", "kind": "theory", "occ": [["D13", 10, "What are the principles followed in Extreme Programming?"], ["D16R", null, "Explain refactoring, spike solutions and JAD in agile software process."], ["M17", 4, "Describe the XP concepts of refactoring and pair programming."], ["N18", 7, "Explain spike solution, refactoring, project velocity, pair programming in XP."], ["J19", 7, "Explain Extreme Programming (XP) agile model with key features and neat labelled diagram."], ["N22", 5, "Explain 'Sprint' and 'Pair programming' with reference to agile software model."], ["J23", 5, "Explain the concept of XP (Extreme Programming) Coding."], ["N23", 10, "What is Pair Programming? Explain Extreme Programming agile approach with diagram."], ["R25", 5, "Suitability of XP for large, complex projects with distributed teams – challenges and how to address them."]], "ans": ["**XP process (4 activities):** Planning (user stories, values, acceptance criteria, release planning, project velocity) → Design (KIS, CRC cards, spike solution, refactoring) → Coding (unit tests first, pair programming) → Testing (unit tests, continuous integration, acceptance tests) → software increment.", "**Values:** communication, simplicity, feedback, courage, respect.", "**Pair programming:** two developers at one workstation – driver codes, navigator reviews; real-time review, fewer defects, shared knowledge.", "**Refactoring:** improving internal structure of code without changing external behaviour.", "**Spike solution:** quick operational prototype to reduce risk of a difficult design problem.", "**Project velocity:** number of user stories implemented in the first release – used to estimate later releases.", "**XP coding:** write unit tests before code (test-first), pair programming, continuous integration, coding standards.", "**Large distributed teams:** challenges – pair programming & face-to-face communication hard, many teams, documentation needs; address with video tools/remote pairing, Scrum-of-Scrums, CI pipelines, shared coding standards.", "**JAD:** Joint Application Development – workshops with users & developers to define requirements quickly."], "dia": "XP process diagram"}, {"unit": 2, "title": "Scrum – process, roles, sprint, backlog, scrum master, quality & productivity", "kind": "theory", "occ": [["D14", 10, "Differentiate between Extreme Programming (XP) and SCRUM."], ["D15", null, "Describe SCRUM agile process model with advantages and disadvantages."], ["D16", null, "What is an Agile process? Describe the working of SCRUM."], ["M17", 12, "With neat labelled diagram, describe Scrum methodology; give example applications."], ["N17", null, "Explain Scrum model with its key features and neat labeled diagram."], ["N19", 7, "Explain SCRUM agile development approach with suitable diagram."], ["J23", 10, "What is an agile process? Explain Sprint, Scrum Master, Product Backlog."], ["N23", 10, "Write a note on Scrum approach."], ["F24", 10, "Explain with suitable diagram how scrum helps build a quality software product."], ["D24", 5, "To what extent does Scrum contribute to improving team productivity and project success?"], ["D25", 10, "Define the three key roles in the Scrum framework and their core responsibilities."], ["D25", 10, "Describe the major features of Scrum and analyze the role of backlog and sprint cycles in managing change."]], "ans": ["**Scrum** = agile framework with time-boxed **sprints (2–4 weeks)** delivering a potentially shippable increment.", "**Roles:** Product Owner (owns & prioritises product backlog, represents customer), Scrum Master (facilitator, removes impediments, ensures Scrum is followed), Development Team (self-organizing, cross-functional, builds the increment).", "**Artifacts:** Product backlog (prioritised list of features/requirements), Sprint backlog (items chosen for the sprint), Increment.", "**Events:** Sprint planning → Daily Scrum (15-min: what done, what next, obstacles) → Sprint review/demo → Sprint retrospective.", "**Diagram:** Product backlog → Sprint backlog → Sprint (2–4 wks) with 24-hr daily scrum loop → potentially shippable increment.", "**Quality/productivity:** frequent demos & feedback, daily inspection, definition of done, retrospectives for improvement, transparency, focus via time boxes.", "**Managing change:** new requirements go into product backlog and are re-prioritised; sprint backlog is frozen during a sprint → change absorbed at sprint boundaries.", "**XP vs Scrum:** XP prescribes engineering practices (pair programming, TDD, refactoring); Scrum is a management framework (roles, sprints); XP iterations 1–2 wks and allows change inside iteration, Scrum doesn't.", "**Disadvantages:** scope creep, needs experienced team, hard for large teams, less documentation."], "dia": "Scrum process diagram"}, {"unit": 2, "title": "Capability Maturity Model (CMM / CMMI) – maturity levels, KPAs, significance", "kind": "theory", "occ": [["D14", 5, "Short note: CMMI"], ["D14R", null, "Detailed note: CMMI"], ["J15", null, "Explain CMM with its significance in the organization in detail."], ["D15", null, "Key process areas required to achieve CMMI maturity levels Managed, Defined, Quantitatively Managed and Optimizing."], ["D16", 4, "Capability Maturity Model (CMM) levels in process models."], ["N19", null, "Short note: CMMI"], ["N22", 10, "Explain the various maturity levels of capability maturity model (CMM)."], ["J23", 10, "Explain the various maturity levels of capability maturity model (CMM)."], ["D25", 10, "Judge whether adopting CMMI processes necessarily guarantees higher software quality or whether contextual organizational factors play a greater role."]], "ans": ["Developed by **SEI (Carnegie Mellon)** to assess and improve the maturity of an organisation's software process.", "**Level 1 Initial:** ad hoc, chaotic; success depends on individuals.", "**Level 2 Managed (Repeatable):** basic project management – requirements mgmt, project planning, monitoring & control, supplier agreement mgmt, measurement & analysis, process & product QA, configuration mgmt.", "**Level 3 Defined:** organisation-wide standard process – requirements development, technical solution, product integration, verification, validation, org. process focus & definition, training, integrated project mgmt, risk mgmt, decision analysis.", "**Level 4 Quantitatively Managed:** process measured & controlled statistically – org. process performance, quantitative project mgmt.", "**Level 5 Optimizing:** continuous improvement – org. innovation & deployment (performance mgmt), causal analysis & resolution.", "**Significance:** predictable schedules & cost, better quality, benchmark for contracts, roadmap for improvement.", "**Guarantee? (D25):** No – CMMI improves process capability, but quality also depends on people's skills, management commitment, culture, project context and real adherence (not just certification)."], "dia": null}, {"unit": 3, "title": "Structural vs behavioral UML diagrams; UML bridging OOA and OOD", "kind": "theory", "occ": [["N23", 5, "Describe Structural diagrams and Behavior diagrams in UML."], ["D25", 10, "Critically evaluate the importance of UML in bridging the gap between OOA and OOD; example of a conceptual model transitioning into UML diagrams."]], "ans": ["**Structural (static):** show things in the system – Class, Object, Component, Deployment, Package, Composite structure diagrams.", "**Behavioral (dynamic):** show how the system behaves – Use case, Activity, State machine, and Interaction diagrams (Sequence, Communication/Collaboration, Timing, Interaction overview).", "**UML bridges OOA→OOD:** one common notation; analysis use cases & domain class model are refined into design classes (attributes, methods, visibility), sequence diagrams assign responsibilities, component/deployment diagrams map to implementation.", "**Example:** Library – OOA: use case 'Issue Book', conceptual classes Member, Book → OOD: class diagram with methods issue(), sequence diagram Member→IssueController→BookCopy, state diagram of BookCopy."], "dia": null}, {"unit": 3, "title": "Event in UML and how it is modelled", "kind": "theory", "occ": [["F24", 5, "Define the term 'Event' and how it is modelled in UML."]], "ans": ["**Event:** a significant occurrence at a point in time that can trigger a state transition.", "Types: **call event** (operation invoked), **signal event** (asynchronous signal received), **time event** (after(5 s)/when(time)), **change event** (when(condition becomes true)).", "Modelled on **state machine diagrams** as transition labels: `event [guard] / action`; signals shown with «signal» class; in activity diagrams as accept-event actions."], "dia": null}, {"unit": 3, "title": "Use case diagram – design and use case vs class diagram", "kind": "diagram", "occ": [["N22", 5, "Design Use Case Diagram for Online Course Registration system."], ["R25", 5, "How do Use Case Diagrams and Class Diagrams differ in purpose, focus and usage?"]], "ans": ["**Elements:** actors (stick figures), use cases (ovals), system boundary, associations, «include», «extend», generalization.", "**Course registration:** actors Student, Admin/Faculty, Payment gateway; use cases Login, View courses, Register course, Pay fees («include» Login), Drop course, Approve registration, Generate report.", "**Use case vs class:** use case = behavioural, external view of **what** the system does for actors (requirements); class = structural, internal **static structure** (classes, attributes, operations, relationships) used for design & code."], "dia": "Use case diagram"}, {"unit": 3, "title": "Use case + activity diagrams together in scenario-based modelling", "kind": "theory", "occ": [["D24", 10, "Evaluate the effectiveness of using Use-Case and Activity Diagrams together in scenario-based modeling; strengths and limitations."]], "ans": ["**Use case** gives the scope and actors' goals; **activity diagram** details the flow of each use case (steps, decisions, parallel actions, swimlanes).", "**Strengths:** complete picture (who + how), easy for customers to validate, exposes alternative/exception flows, helps derive test cases.", "**Limitations:** no data/structure view, can grow large and duplicate text descriptions, not precise about timing or object interactions (need sequence/state diagrams)."], "dia": null}, {"unit": 3, "title": "Class diagram – design (relationships) for a given system", "kind": "diagram", "occ": [["N22", 10, "Design UML class diagram for pothole reporting system."], ["J23", 10, "Design UML class diagram for Online Quiz management system for college placement."], ["F24", 10, "Design a Class Diagram to automate Library Management System."], ["D25", 5, "What are the different types of relationships used in class diagrams? Explain with examples."]], "ans": ["**Class box:** name / attributes (with visibility +,-,#) / operations.", "**Relationships:** Association (Student—Course), Aggregation ◇ (Department has Professors – weak whole/part), Composition ◆ (Order contains OrderLines – strong), Generalization/Inheritance △ (Member ← Student, Faculty), Dependency (dashed arrow), Realization (class implements interface); show multiplicity (1, 0..*, 1..*).", "**Library:** Member, Librarian, Book, BookCopy, Issue/Loan, Reservation, Fine – Book 1 ◆ * BookCopy, Member 1 — 0..* Loan.", "**Online quiz:** Candidate, Exam, Level, Question, Answer, Result, Admin; Exam ◆ Questions, Candidate — Result.", "**Pothole system:** Sensor, Pothole(location, severity), Smartphone/App, Location, RemoteDatabase, Map, Reviewer.", "State assumptions; add multiplicities."], "dia": "Class diagram"}, {"unit": 3, "title": "Sequence diagram – design for a given scenario", "kind": "diagram", "occ": [["N22", 10, "Develop sequence diagram for any 2 scenarios of Food Ordering system."], ["N23", 10, "Develop a Sequence Diagram for E-commerce firm: Login and Product Order functionality."], ["F24", 10, "Develop sequence diagram for online bookshop."], ["D24", 10, "Design a sequence diagram for an advanced ATM system (balance, transfer, print summary in one session)."], ["D25", 10, "Design a labelled sequence diagram for Online Examination System (Exam Portal UI, Exam Controller, Student, Exam, Question Bank, Answer Sheet)."]], "ans": ["**Elements:** objects/actors at top, **lifelines** (dashed), **activation bars**, synchronous messages (solid arrow), return messages (dashed), self-messages, combined fragments (alt, opt, loop).", "Order messages top-to-bottom in time; number them.", "**ATM:** User → ATM UI: insertCard/PIN → AuthService: verify → loop[actions]: balance → BankServer: getBalance; transfer → BankServer: transfer(); print → Printer: printSummary → eject card.", "**Online exam (D25):** Student → ExamPortalUI: login → ExamController: authenticate → Student entity: validate → ExamController → Exam: getDetails → UI display → loop [each question] ExamController → QuestionBank: fetchQuestion; Student submits → AnswerSheet: store → submit → finalize AnswerSheet → startEvaluation.", "**E-commerce:** login (User→UI→AuthController→UserDB) and order (UI→Cart→OrderController→Inventory→Payment→Order DB→confirmation)."], "dia": "Sequence diagram"}, {"unit": 3, "title": "Collaboration (communication) diagram – design and comparison", "kind": "diagram", "occ": [["R25", 10, "Draw collaboration diagram for online booking of travel tickets in railway reservation system."]], "ans": ["Shows objects as rectangles connected by **links**; messages are **numbered** (1, 1.1, 2…) along links to show order.", "**Railway:** Passenger → 1: login → :BookingUI → 2: searchTrains → :TrainDB; 3: selectSeat → :Reservation; 4: makePayment → :PaymentGateway; 5: confirm → :Ticket; 6: sendTicket → Passenger."], "dia": "Collaboration diagram"}, {"unit": 3, "title": "Sequence diagram vs collaboration diagram", "kind": "comparison", "occ": [["J23", 5, "Differentiate between the interaction models: sequence diagram and collaboration diagram."], ["N23", 10, "Compare sequence diagram and collaboration diagram in UML."], ["F24", 10, "Compare sequence diagram with collaboration diagram in UML on 5 parameters."]], "ans": ["| Parameter | Sequence | Collaboration |", "| Emphasis | **Time ordering** of messages | **Structural organisation** of objects/links |", "| Layout | Lifelines vertically, time downwards | Objects anywhere, connected by links |", "| Order | Implied by vertical position | Shown by sequence numbers (1, 1.1, 2) |", "| Elements | Lifelines, activation bars, fragments (alt/loop) | Objects, links, numbered messages |", "| Best for | Complex scenarios, timing, many messages | Seeing which objects collaborate |", "Both are **interaction diagrams** and are semantically equivalent (can convert one to the other)."], "dia": null}, {"unit": 3, "title": "Collaboration vs activity diagrams for real-time systems", "kind": "comparison", "occ": [["R25", 10, "Evaluate collaboration diagrams versus activity diagrams in modeling real-time systems; which gives better insights for optimization?"]], "ans": ["**Collaboration:** object interactions & links with numbered messages – good to find communication bottlenecks, coupling between objects.", "**Activity:** workflow, decisions, **concurrency (fork/join)**, swimlanes – good for process flow & parallelism.", "For **real-time optimisation**, activity diagrams (with concurrency) + state/timing diagrams usually give better insight into parallel tasks and delays; collaboration diagrams help optimise object communication. Justify with an example (e.g., traffic signal controller)."], "dia": null}, {"unit": 3, "title": "Activity diagram – design for a given system", "kind": "diagram", "occ": [["J23", 10, "Design UML Activity diagram for Online Movie Ticket Booking system."], ["N23", 10, "Develop Activity diagram for Order Management system (any 5 activities)."], ["D24", 10, "Design Activity diagram for Library Management System."]], "ans": ["**Notation:** initial node ●, activity (rounded rectangle), decision/merge ◇ with guards [ ], fork/join bars for parallel flows, swimlanes for actors, final node ◉.", "**Movie booking:** Login → Select movie → Select show → Choose seats → [seats available?] → Make payment → [success] Generate ticket & send SMS/email → End; else retry.", "**Order management:** Receive order → Check inventory → [in stock] Process payment ∥ Pack items → Ship → Update status/invoice → End.", "**Library:** Member login → Search book → [available] Issue book → Update records; [not available] Reserve → Return book → [late?] Calculate fine → End."], "dia": "Activity diagram"}, {"unit": 3, "title": "State (state machine / state transition) diagram – design", "kind": "diagram", "occ": [["D15", null, "Draw State Transition Diagram for Laser Printer."], ["D16", 4, "State Diagram for Library Management System."], ["N18", 7, "Design State Diagram for 'Automatic washing machine system' (soak, rinse, drain, dry; min 5 states)."], ["J23", 10, "Develop State Diagram for Online Inventory Management System."], ["D24", 10, "Develop state machine diagram for Bank ATM (Off, Self Test, Out of Service, Idle, Serving Customer composite state)."], ["D25", 10, "Design a labelled state transition diagram for BookCopy in Library Management System (Available, Reserved, Issued, Overdue)."]], "ans": ["**Notation:** initial ●, states (rounded boxes with entry/do/exit actions), transitions `event [guard] / action`, composite states, final ◉.", "**ATM:** Off –power on→ Self Test –[fail]→ Out of Service; Self Test –[pass]→ Idle; Idle –card inserted→ Serving Customer (entry/readCard; substates Customer Authentication → Selecting Transaction → Transaction); Serving Customer –cancel→ Idle; –done→ Idle; power off → Off.", "**BookCopy:** Available –hold request→ Reserved; Reserved –[15 days, not collected]→ Available; Reserved –collected→ Issued; Available –borrow→ Issued; Issued –returned [≤ due date]→ Available; Issued –[due date passed]→ Overdue; Overdue –returned / calculateFine, recordPayment→ Available.", "**Washing machine:** Idle → Filling → Soaking → Washing → Rinsing → Draining → Drying → Done (with door-open/pause transitions)."], "dia": "State machine diagram"}, {"unit": 4, "title": "Requirement engineering – tasks/phases, elicitation, elaboration, negotiation, win-win", "kind": "theory", "occ": [["D13", 10, "What are requirement engineering tasks? Explain elicitation and elaboration."], ["J14", null, "What are requirement engineering tasks? Explain elicitation and elaboration."], ["N17", 5, "What is requirement gathering? Explain various requirement engineering tasks."], ["N19", 4, "What is requirement analysis? Write major activities of requirement analysis."], ["N22", 10, "Explain the various phases of requirement engineering. What does win-win mean in negotiation?"], ["J23", 10, "Discuss the various phases of requirement engineering."], ["N23", 5, "Explain Requirements Engineering stages: Elicitation, Negotiation."], ["D25", 10, "'Requirements Engineering is not just documenting what users want, but balancing conflicting needs…' – critically discuss its role in project success."]], "ans": ["**7 tasks:** Inception → Elicitation → Elaboration → Negotiation → Specification → Validation → Requirements management.", "**Inception:** basic understanding of problem, stakeholders, nature of solution.", "**Elicitation:** gather requirements from stakeholders – interviews, meetings, questionnaires, QFD, use-case scenarios; problems of scope, understanding, volatility.", "**Elaboration:** refine into analysis model – use cases, classes, behaviour, data.", "**Negotiation:** resolve conflicts; prioritise; **win-win** = both customer (gets system satisfying most needs) and developer (realistic budget & deadline) win.", "**Specification:** SRS document/models. **Validation:** reviews check for errors, ambiguity, omissions, conflicts. **Management:** traceability tables, change control.", "**Role in success (D25):** most failures come from poor requirements; RE balances conflicting stakeholder needs, removes ambiguity, checks feasibility, sets baseline for design/testing/estimation."], "dia": null}, {"unit": 4, "title": "Functional and non-functional requirements (with examples)", "kind": "theory", "occ": [["D14R", null, "What are functional and non-functional requirements for ATM of any bank?"], ["J14", null, "Online examination system (registration, administration, automatic evaluation, rank list) – describe the non-functional requirements."], ["N17", 7, "What do you mean by requirements? Explain functional and non-functional requirements with examples."]], "ans": ["**Requirement:** a condition or capability the system must provide.", "**Functional:** what the system does – ATM: authenticate card & PIN, withdraw cash, balance inquiry, fund transfer, print receipt, change PIN.", "**Non-functional:** how well – performance (response < 3 s), security (encryption, 3 wrong PIN → block), availability 24×7, reliability, usability, scalability, maintainability, legal compliance.", "**Online exam NFRs:** handle 1000 concurrent users, secure login & anti-cheating, auto-save answers, 99.9% availability during exams, results in < 1 min, browser compatibility, data privacy."], "dia": null}, {"unit": 4, "title": "SRS document (with example)", "kind": "theory", "occ": [["D15", null, "Short note: System Requirement Specification document with example"]], "ans": ["**SRS** = formal, complete description of what the software must do; agreement between customer and developer.", "**Structure (IEEE 830):** Introduction (purpose, scope, definitions, references) → Overall description (product perspective, functions, users, constraints, assumptions) → Specific requirements (functional, external interfaces, performance, design constraints, quality attributes) → Appendices.", "**Good SRS:** correct, unambiguous, complete, consistent, verifiable, modifiable, traceable.", "Example: Library system – FR: issue/return book; NFR: response < 2 s."], "dia": null}, {"unit": 4, "title": "Data Flow Diagram (DFD) – design Level 0/1/2 for a given system", "kind": "diagram", "occ": [["D14", 10, "Construct level 0, 1 and 2 DFD for Air ticket Booking System (ABS)."], ["J15", null, "Explain DFD with an example."], ["D16", null, "Draw a DFD for ATM software up to level 2."], ["D16R", null, "Construct level 0, 1 and 2 DFD for online railway ticket reservation system."], ["M17", 7, "Draw a DFD for an Online Railway Reservation System up to Level 2."], ["N17", null, "Purpose of DFDs and notations; construct DFD (Level-0 and Level-1) for library management system."], ["N18", 7, "Design DFD up to level-2 for Online shopping system (min five functionalities in level-1)."], ["J19", 7, "Design DFD (Level 0, 1 & 2) for amazon.com online shopping system."], ["N19", null, "Draw DFD up to level 2 for result preparation automation system of B.Tech courses."], ["N22", 10, "Develop a DFD Level 0 and Level 1 for Food ordering system."], ["J23", 10, "Develop Level 0 and Level 1 DFD for Online logistics (inventory) management system."], ["N23", 10, "Develop DFD level 1 for ordering cap and gown for graduation."], ["R25", 10, "Design DFD level 0 and level 1 for online shopping on e-commerce website."], ["D25", 10, "Explain how Level-0, 1 and 2 DFD can be applied for a Student Enrollment System; how successive levels increase detail."]], "ans": ["**Purpose:** shows how data flows through the system – inputs, processes, stores, outputs (functional/data view).", "**Notations:** external entity (rectangle), process (circle/bubble), data flow (labelled arrow), data store (open/parallel lines).", "**Level 0 (context diagram):** single process = whole system + external entities + main flows.", "**Level 1:** 5–7 major processes (e.g., online shopping: 1 Register/Login, 2 Browse products, 3 Manage cart, 4 Place order, 5 Make payment, 6 Ship & track) with data stores (Customer, Product, Order, Payment).", "**Level 2:** decomposes one level-1 process (e.g., 5 Payment → 5.1 Select method, 5.2 Validate card, 5.3 Authorise with bank, 5.4 Generate invoice).", "**Rules:** balancing (inputs/outputs preserved between levels), number processes, no flow directly between two entities or two stores, every process has input and output.", "**Successive levels** = functional decomposition – each level adds detail while keeping the same external interfaces."], "dia": "Data Flow Diagram (Level 0/1/2)"}, {"unit": 4, "title": "Control Flow Diagram (CFD) / control flow model – design", "kind": "diagram", "occ": [["D14", 10, "Design Control Flow Diagram for Printing Machine (consider all the states)."], ["D15", null, "Write three scenarios and draw Context and Control Flow Diagram for Automatic Water Level Control System."], ["D16R", null, "Design Control Flow Diagram for online railway ticket reservation system."], ["J19", 7, "Design the Control Flow Diagram (CFD) for amazon.com online shopping system."]], "ans": ["**CFD** models **events and control** (not data): same process bubbles as DFD, but control flows shown as **dashed arrows**, and a **control specification (CSPEC)** bar.", "CSPEC contains a **state diagram / process activation table** describing how events activate processes.", "**Printer:** events paper jam, out of paper, start, print done → states Idle, Printing, Paper-jam, Reloading.", "**Water level control:** sensor events (tank low, tank full) → control motor & inlet valve; states Pump ON / OFF / Valve open.", "Used for **real-time / event-driven** systems."], "dia": "Control Flow Diagram"}, {"unit": 4, "title": "Data flow model vs control flow model (real-time systems, design improvements)", "kind": "comparison", "occ": [["R25", 10, "Evaluate the effectiveness of using a Control Flow Model for real-time systems compared to a Data Flow Model; which scenarios suit each."], ["D24", 10, "Critically evaluate a complex system where both Data Flow and Control Flow Models are used; how would you prioritize design improvements?"]], "ans": ["**Data flow model:** how data is transformed; best for information/business systems (banking, e-commerce, payroll).", "**Control flow model:** events, states, timing; best for real-time & embedded systems (ATM hardware, traffic control, water-level controller, printer).", "Real-time systems need both: DFD for data processing, CFD/state diagrams for event handling.", "**Prioritising improvements:** use DFD to find redundant processes, bottleneck data stores, unnecessary transformations; use CFD to find timing-critical events, deadlocks, missing states – fix safety/timing issues first, then data efficiency."], "dia": null}, {"unit": 4, "title": "Analysis model → design model translation; elements of analysis model; relationships", "kind": "theory", "occ": [["D13", 10, "How analysis model is translated into design model? Explain with diagram."], ["J14", null, "How analysis model is translated into design model? Explain with diagram."], ["D14", 10, "List the quality design principles; discuss transforming analysis model into design model."], ["D14R", null, "How analysis model is translated into design model? Explain with diagram."], ["J15", null, "What are elements of analysis model? Explain the mapping of analysis model elements to design model."], ["R25", 10, "Key relationships between the analysis model and the design model; influence on system architecture."]], "ans": ["**Analysis model elements:** scenario-based (use cases, activity diagrams), class-based (class diagrams, CRC), behavioural (state, sequence diagrams), flow-oriented (DFD, CFD, data dictionary).", "**Design model (pyramid, bottom→top):** Data/class design → Architectural design → Interface design → Component-level design.", "**Mapping:** data dictionary, ERD, class diagrams → data design; DFD & analysis classes → architectural design; scenarios, DFD, state diagrams → interface design; process specs, state diagrams, CSPEC → component-level design.", "**Quality design principles:** design should be traceable to analysis model, not reinvent the wheel, minimise intellectual distance, uniform & integrated, accommodate change, degrade gently, be reviewed, assessed for quality.", "**Influence on architecture:** analysis model defines what the architecture must support (functions, data, behaviour) – partitioning of subsystems derives from it."], "dia": "Analysis model to design model translation diagram"}, {"unit": 4, "title": "Design concepts: abstraction, functional independence, cohesion & coupling, modularity", "kind": "theory", "occ": [["D13", 5, "Define the term abstraction in software engineering."], ["D13", 10, "Explain the role of functional independence, cohesion and coupling with respect to modular design."], ["J14", null, "Explain the role of functional independence, cohesion and coupling with respect to modular design."], ["J15", null, "'High Coupling and Low Cohesion' is ideal for software design – TRUE or FALSE? Justify with example."], ["N17", 7, "Short note: Fundamental software design concepts."]], "ans": ["**Design concepts:** abstraction, architecture, patterns, separation of concerns, modularity, information hiding, functional independence, refinement, refactoring, design classes.", "**Abstraction:** focus on essential details and hide the rest – procedural abstraction (e.g., open door) and data abstraction (door: type, size, swing).", "**Functional independence:** each module does one function with minimal interaction – measured by cohesion & coupling.", "**Cohesion:** strength within a module (functional – best, sequential, communicational, procedural, temporal, logical, coincidental – worst).", "**Coupling:** interdependence between modules (data – best, stamp, control, external, common, content – worst).", "**High coupling + low cohesion = FALSE** – ideal is **high cohesion, low coupling** → easier maintenance, testing, reuse, fewer ripple effects."], "dia": null}, {"unit": 4, "title": "Structure chart vs flow chart", "kind": "comparison", "occ": [["D24", 5, "Difference between Structure chart and Flow chart; basic building blocks of a structure chart."]], "ans": ["**Structure chart:** hierarchical view of **modules** and calls (architecture); **flow chart:** sequence of steps/control flow inside a program.", "Structure chart shows **what** modules exist and their interfaces; flowchart shows **how** logic proceeds (decisions, loops).", "**Building blocks:** module (rectangle), library module (double-sided rectangle), conditional call (diamond), loop (curved arrow), data couple (arrow with empty circle), control couple/flag (arrow with filled circle), connecting lines (calls)."], "dia": null}, {"unit": 5, "title": "Software architecture – definition, importance, architectural styles (classification)", "kind": "theory", "occ": [["D13", 10, "Explain the different styles of Software Architectures."], ["J14", null, "Explain the different styles of Software Architectures."], ["D14R", null, "Detailed note: Software Architectural Styles"], ["J15", null, "Note: Architecture Styles"], ["N17", null, "Importance of architecture in SE; list and describe types of architectural styles."], ["N19", null, "What is software architecture? Discuss the classification of architectural styles."], ["N22", 10, "What is software architecture? Explain layered and data flow architecture with diagram."], ["J23", 10, "Explain with suitable diagram any two architectural styles."]], "ans": ["**Architecture:** structure of the system – components, their externally visible properties, and relationships among them.", "**Importance:** enables communication among stakeholders, highlights early design decisions, gives a transferable model of how the system is structured.", "**Styles (Pressman):** Data-centered, Data-flow (pipe & filter, batch sequential), Call and return (main program/subprogram, remote procedure call), Object-oriented, Layered.", "Each style = set of components + connectors + constraints + semantic models.", "Draw each style with a diagram and one example (compiler = pipe & filter, OS/network = layered, database apps = data-centered)."], "dia": "Architectural style diagrams"}, {"unit": 5, "title": "Layered architecture / call-and-return architecture", "kind": "theory", "occ": [["D14", 10, "Layered architecture style is suitable for most system software. Justify."], ["N18", 7, "Explain architecture style and architecture pattern. When can we use Call and Return architecture? Justify with example."], ["N23", 10, "Explain Call and return architecture and Layered architecture."]], "ans": ["**Layered:** concentric/stacked layers – each layer provides services to the layer above (core/OS layer → utility → application → user interface). Ex: OSI model, operating systems.", "**Justify for system software:** separation of concerns, portability (change lower layer only), maintainability, security (inner layers protected), reuse, standard interfaces.", "**Call and return:** main program calls subprograms in a hierarchy; variants – main program/subprogram and remote procedure call. Use when system is easy to modify and scale with clear control hierarchy (e.g., payroll, billing systems).", "**Style vs pattern:** style = overall system-level organisation (e.g., layered); pattern = solution to a specific recurring design problem within architecture (e.g., MVC, broker, concurrency/persistence patterns)."], "dia": "Layered architecture diagram"}, {"unit": 5, "title": "Data-centered and data-flow architecture (comparison, performance, scalability)", "kind": "comparison", "occ": [["D16", 4, "Data-centered architectural style with example."], ["M17", 6, "Discuss Data flow architectural style with suitable example."], ["J19", 7, "Which architectural style is suitable for college blackboard system? Explain with diagram."], ["D24", 10, "Analyze the differences between data-centered and data-flow architecture; impact on performance and scalability."]], "ans": ["**Data-centered (repository/blackboard):** central data store accessed by independent client components; passive repository or active **blackboard** that notifies clients. Ex: DBMS apps, CASE tools, **college blackboard system**.", "**Data-flow (pipe & filter):** input transformed by a series of **filters** connected by **pipes**; batch-sequential if linear. Ex: compiler, Unix pipes, signal processing.", "**Performance:** data-centered → central store can bottleneck; data-flow → filters can run concurrently (streaming), but overhead of data conversion.", "**Scalability:** data-centered scales with DB replication/sharding but needs concurrency control; data-flow scales by adding/parallelising filters but poor for interactive apps."], "dia": "Data-centered / pipe-and-filter diagram"}, {"unit": 5, "title": "Partitioning the architecture (horizontal & vertical); why architecture is important", "kind": "theory", "occ": [["D16R", null, "Why architecture is important? What is partitioning the architecture? Explain with example."], ["J19", 7, "Why partitioned architecture design is required? Explain vertical and horizontal partitioned architecture with neat diagram."]], "ans": ["**Partitioning** splits program structure so it is easier to test, maintain, extend; fewer side effects.", "**Horizontal partitioning:** separate branches for major functions – **input, data transformation (process), output**, with control modules coordinating.", "**Vertical partitioning (factoring):** control/decision-making in top-level modules, **work** done by low-level modules – changes to workers have less impact.", "Benefits: easier testing & maintenance, side effects contained, extensible."], "dia": "Horizontal & vertical partitioning diagram"}, {"unit": 5, "title": "Transform mapping / mapping data flow into software architecture", "kind": "theory", "occ": [["D15", null, "Explain Transform Mapping with suitable diagram."], ["D16", null, "How are requirements mapped into a software architecture when 'Transform Flow' is present?"], ["N18", 7, "Explain steps for mapping data flow into software architecture."], ["J23", 10, "Discuss the steps of Transform mapping through which DFD with transform flow can be mapped into an architectural style."]], "ans": ["**Transform flow:** data enters (incoming flow), is transformed (transform centre), leaves (outgoing flow).", "**Steps:** (1) Review fundamental system model (level 0 DFD); (2) Review & refine DFDs; (3) Determine whether DFD has transform or transaction flow; (4) Isolate the transform centre by marking incoming and outgoing flow boundaries; (5) **First-level factoring** – top controller with input, transform and output controllers; (6) **Second-level factoring** – map each DFD bubble to modules under controllers; (7) Refine the first-iteration architecture using design heuristics (cohesion/coupling).", "Result: call-and-return program structure (structure chart)."], "dia": "Transform mapping (DFD → structure chart)"}, {"unit": 5, "title": "Data mining & data warehousing influence on architecture / database design", "kind": "theory", "occ": [["D25", 10, "Analyze the influence of data mining and data warehousing on architectural decisions in large-scale systems; database design at architectural and component levels."]], "ans": ["**Data warehouse:** separate, integrated, subject-oriented, time-variant, non-volatile store for analysis (OLAP), unlike operational OLTP databases.", "**Architectural level:** separate operational DB from warehouse, ETL pipelines, data marts, scalability & storage tiers, batch vs real-time analytics, security & governance.", "**Data mining:** discovering patterns from large data → needs clean, aggregated, historical data and processing power (distributed/parallel components).", "**Component level:** star/snowflake schemas, indexing, partitioning, data structures and algorithms in components that access the warehouse."], "dia": null}, {"unit": 6, "title": "Golden rules of user interface design (three golden rules)", "kind": "theory", "occ": [["D13", 10, "Discuss the golden rules for designing a User Interface."], ["J14", null, "Discuss the golden rules for designing a User Interface."], ["D14", 10, "Explain three golden rules of interface design. Elaborate UI design for Air ticket Booking system."], ["D14R", null, "What are the golden rules for User Interface Design?"], ["J15", null, "Explain the golden rules for designing the user interface."], ["D15", null, "Design UI for Sign In to email service; explain how golden rules are applied."], ["D16", 6, "What are the Golden Rules of Interface Design?"], ["M17", 6, "Explain the golden rules for user interface design."], ["N17", 4, "List and explain the golden rules for user interface design."], ["N18", 7, "Design any ONE interface for online shopping based on golden rules and explain each rule."], ["N19", 7, "Explain the golden rules for user interface design."], ["N22", 10, "Discuss the golden rules for designing the user interface with relevant example."], ["N23", 10, "Explain three golden rules of interface design in detail."], ["F24", 10, "Explain three golden rules of interface design in detail."]], "ans": ["**1. Place the user in control:** interaction modes that don't force unwanted actions; flexible interaction (keyboard, mouse, voice); interruptible & **undoable** actions; customise for skill levels; hide technical internals; direct manipulation of on-screen objects.", "**2. Reduce the user's memory load:** reduce short-term memory demand; meaningful **defaults**; intuitive shortcuts; real-world metaphors; disclose information progressively.", "**3. Make the interface consistent:** user knows the context of current task; consistency across a family of applications; don't change past interactive models users expect (e.g., Ctrl+S = save).", "**Example (email sign-in / shopping):** remember-me & default fields (memory), cancel/back anytime & show-password toggle (control), same button styles/positions on every page (consistency)."], "dia": null}, {"unit": 6, "title": "Placing the user in control / reducing memory load / consistency – evaluation", "kind": "theory", "occ": [["D24", 5, "Explain 'placing the user in control'; examples of making user interaction flexible and interruptible."], ["R25", 10, "Evaluate consistency vs placing the user in control and reducing memory load; which rule has greatest impact on UX? Real-world examples."], ["R25", 10, "Evaluate reducing the user's memory load in improving usability; prioritise against consistency and feedback."]], "ans": ["**User control examples:** undo/redo (Ctrl+Z), cancel long downloads, pause & resume video, save draft and continue later, multiple input modes, skip wizard steps, customizable toolbars.", "**Memory load examples:** autocomplete & recent searches, default values, visible menus instead of commands, breadcrumbs, icons with labels, progressive disclosure.", "**Consistency examples:** same navigation bar on all pages, standard icons (trash = delete), Material/iOS guidelines.", "**Evaluation:** all three are complementary; many argue **consistency** has the greatest impact because it lowers learning effort and memory load; for complex apps, **reduced memory load** is critical; feedback supports all three (loading indicators, error messages).", "Conclude by prioritising per user type: novices → memory load & consistency; experts → control & shortcuts."], "dia": null}, {"unit": 6, "title": "User interface design models / analysis & design models (four models)", "kind": "theory", "occ": [["D16R", null, "List and explain user interface design models."], ["J19", 7, "List and explain the four different models in the design and analysis of user interface."]], "ans": ["**User model (user profile):** established by software engineer – age, background, skills, motivation; novices, knowledgeable intermittent, knowledgeable frequent users.", "**Design model:** created by software engineer – data, architecture, interface & procedural representation of the software.", "**Mental model (system perception):** the user's image of the system in their head.", "**Implementation model:** look and feel of the interface + supporting information (manuals, help).", "Goal: make implementation model coincide with the user's mental model."], "dia": null}, {"unit": 6, "title": "Interface design steps / UI analysis and design process", "kind": "theory", "occ": [["J23", 10, "Explain the interface design steps for designing the user interface of a software."]], "ans": ["**Process (spiral):** Interface analysis (users, tasks, content, environment) → Interface design → Interface construction (prototype) → Interface validation.", "**Design steps:** (1) Define interface objects and actions (operations) from analysis information; (2) Define events (user actions) that change the state of the UI; model this behaviour; (3) Depict each interface state as it looks to the user; (4) Indicate how the user interprets the state of the system from information on the interface.", "**Design issues:** response time, help facilities, error handling, menu & command labelling, accessibility, internationalisation."], "dia": null}, {"unit": 6, "title": "Design a UI / screen layout for a given application", "kind": "diagram", "occ": [["D14R", null, "Design Screen Layouts to enter data required to generate Student Identity Card with Image."]], "ans": ["Sketch a form: title bar, fields – Name, Roll no., Course, Year, DOB, Blood group, Address, Contact; **Upload photo** button with preview; Save / Preview card / Cancel buttons.", "Apply golden rules: required fields marked, default values (current year), validation messages near fields, consistent alignment, undo/clear, tab order."], "dia": "UI screen layout"}, {"unit": 7, "title": "Software quality – definition, McCall's quality factors / triangle", "kind": "theory", "occ": [["D14", 10, "What is software quality? Explain McCall's Triangle of quality attributes."], ["J15", null, "Explain McCall's software quality factors in detail."], ["D16R", null, "What is software quality? Explain McCall's Triangle of quality attributes."], ["N18", 7, "List down McCall's quality triangle factors."], ["N19", 7, "Explain McCall's Software Quality Factors in detail."], ["N22", 10, "Discuss the McCall's software quality factors."], ["F24", 10, "Describe the McCall's quality factors."], ["F24", 5, "What do you understand by software quality?"], ["D24", 10, "How would you apply McCall's quality factors to evaluate a newly developed product? Which factors would you prioritize?"]], "ans": ["**Software quality:** conformance to explicitly stated functional & performance requirements, documented development standards, and implicit characteristics expected of professionally developed software.", "**McCall (1977): 11 factors in 3 perspectives (triangle):**", "**Product operation:** Correctness (does what I want), Reliability (accurately all the time), Efficiency (runs well on hardware), Integrity (secure), Usability (easy to use).", "**Product revision:** Maintainability (can I fix it), Flexibility (can I change it), Testability (can I test it).", "**Product transition:** Portability (other machine), Reusability (reuse parts), Interoperability (interface with other systems).", "**Applying to a new product:** define metrics per factor (correctness → % requirements passed, reliability → MTBF, maintainability → MTTR, usability → user surveys) and prioritise by intended use (banking → integrity/reliability; game → efficiency/usability
