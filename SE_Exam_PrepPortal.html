)."], "dia": "McCall's quality triangle"}, {"unit": 7, "title": "ISO 9126 quality model", "kind": "theory", "occ": [["N23", 10, "Write a note on ISO 9126 Quality Factors."], ["D24", 10, "Explain the ISO 9126 quality model; how efficiency, maintainability and portability define quality."], ["D25", 10, "Which ISO 9126 characteristic – efficiency, maintainability, portability – should be prioritized for government-grade cybersecurity systems?"]], "ans": ["**6 characteristics:** Functionality (suitability, accuracy, interoperability, compliance, security), Reliability (maturity, fault tolerance, recoverability), Usability (understandability, learnability, operability, attractiveness), Efficiency (time behaviour, resource utilisation), Maintainability (analysability, changeability, stability, testability), Portability (adaptability, installability, co-existence, replaceability).", "**Efficiency:** response time & resource use; **Maintainability:** ease of fixing and changing; **Portability:** ease of moving to new environments.", "**Cybersecurity priority:** usually **maintainability** – patches for new threats must be applied quickly & safely (changeability, stability, testability); efficiency matters for real-time detection; portability least critical on controlled infrastructure."], "dia": null}, {"unit": 7, "title": "Verification vs validation (V&V)", "kind": "comparison", "occ": [["D15", null, "Explain verification and validation pertaining to software testing with example."], ["N23", 10, "Compare verification and validation testing."], ["F24", 10, "Compare verification and validation testing."], ["D24", 10, "Evaluate importance of V&V; if you had to prioritize one in a resource-constrained project, which and why?"], ["R25", 5, "Explain the difference between verification and validation; how both ensure software quality."]], "ans": ["**Verification:** 'Are we building the product **right**?' – conformance to specs & standards; reviews, inspections, walkthroughs, static analysis, unit/integration testing; during development; static + dynamic.", "**Validation:** 'Are we building the **right** product?' – meets user needs; UAT, beta testing, prototyping, requirements validation; towards end; mainly dynamic.", "| Aspect | Verification | Validation |  ", "| Focus | Process/spec conformance | Customer needs |", "| Done by | Developers/QA | Users, testers |", "| Example | Code review, design review | Acceptance test, beta test |", "**Both ensure quality:** verification catches defects early & cheaply; validation ensures acceptance. Under limited resources, prioritise early verification (cheaper fixes) but keep minimal validation (UAT) – justify either."], "dia": null}, {"unit": 7, "title": "Testing strategies (for conventional software) and testing techniques", "kind": "theory", "occ": [["J14", null, "Short note: Test strategies for conventional software."], ["D14R", null, "Summarize the testing strategies for a software."], ["J15", null, "Discuss testing strategies and testing techniques."]], "ans": ["**Strategy (spiral):** Unit testing (code) → Integration testing (design) → Validation testing (requirements) → System testing (whole system with other elements).", "**Strategic issues:** specify requirements in quantifiable terms, state testing objectives, understand users, rapid-cycle testing, build robust software, formal technical reviews before testing, continuous improvement.", "**Techniques:** white-box (basis path, control structure – condition, data flow, loop testing) and black-box (equivalence partitioning, BVA, graph-based, orthogonal array)."], "dia": "Testing strategy spiral"}, {"unit": 7, "title": "Unit testing – key aspects, unit test environment, stubs & drivers", "kind": "theory", "occ": [["D14", 10, "Design unit testing environment for ABS; how integration testing would improve the system flaws."], ["D16", null, "Explain the terms Unit testing and Integration testing; compare Top-down and bottom-up testing."], ["D16R", null, "What are stubs and drivers? Differentiate between them."], ["D16R", null, "Design unit testing environment (test cases) for online railway ticket reservation system."], ["N22", 10, "Define Unit Testing. Design Unit test environment (test cases) for 'payment process' of Online Flight Ticket Reservation."], ["J23", 5, "'Unit testing focuses validation effort on the smallest unit of software design' – Do you agree? Justify."], ["J23", 10, "Define driver and stub in unit testing; design unit test environment for 'File upload' in Online Student portal."], ["N23", 5, "Explain key aspect of unit testing."], ["D25", 5, "Explain Unit testing with suitable example."]], "ans": ["**Unit testing** verifies the smallest unit of design (component/module/function) **in isolation** – yes, the statement is true.", "**What is tested:** module interface, local data structures, boundary conditions, independent paths, error-handling paths.", "**Unit test environment:** **Driver** → Module to be tested → **Stubs**; test cases fed by driver, results collected.", "**Driver:** 'main program' that accepts test data, calls the module, prints results (replaces caller). **Stub:** dummy subprogram replacing a module called by the unit; returns minimal data.", "**Example test cases (payment):** valid card + OTP → success; wrong OTP → error; expired card → reject; amount ≤ 0 → invalid; bank timeout (stub) → retry, no double charge.", "Tools: JUnit, NUnit, pytest; automated, repeatable, fast."], "dia": "Unit test environment (driver–module–stubs)"}, {"unit": 7, "title": "Integration testing – need, top-down vs bottom-up, smoke testing", "kind": "theory", "occ": [["D14", 10, "How the integration testing would improve the system flaws (with unit testing ABS)."], ["D15", null, "Explain Integration Testing and Smoke Testing with its benefits."], ["D16", null, "Explain unit testing and integration testing; compare top-down and bottom-up testing."], ["J19", 7, "Explain the working of top down integration testing with its advantages and disadvantages."], ["F24", 10, "Why is integration testing required in software development? Give one example."], ["R25", 10, "Evaluate importance of integration testing; necessity for stability; risks if skipped; example."]], "ans": ["**Integration testing:** systematically combine unit-tested modules while testing their **interfaces** – data lost across interfaces, side effects, wrong parameter formats.", "**Top-down:** start at main control module, move down (depth-first or breadth-first); **stubs** replace lower modules. + early skeleton & control testing; − stubs costly, low-level modules tested late.", "**Bottom-up:** start with atomic modules combined into **clusters**, tested by **drivers**; drivers removed as you move up. + no stubs, low-level modules tested well; − no working program until the end.", "**Smoke testing:** daily build integrated & tested with a basic set of tests; benefits – integration risk minimised, quality improved, easier error diagnosis, progress easy to assess.", "**Risks if skipped:** interface mismatches, crashes in production, data corruption, expensive late fixes. Example: login returns userID as string, payment expects integer."], "dia": "Top-down / bottom-up integration diagram"}, {"unit": 7, "title": "System testing – types; levels of testing", "kind": "theory", "occ": [["D16", null, "Explain the system testing in detail."], ["N22", 10, "Define system testing. Explain the various types of system testing."], ["R25", 10, "Different levels of software testing; how unit, integration and system testing differ in scope and objectives."]], "ans": ["**System testing:** tests the complete integrated system against requirements, including hardware, people, databases.", "**Types:** Recovery testing (forced failures, check recovery), Security testing (protection from improper penetration), Stress testing (abnormal quantity/frequency of resources), Performance testing (run-time performance), Deployment/configuration testing (all platforms).", "**Levels:** Unit (single module, developer, white box) → Integration (interfaces between modules) → System (entire system, black box, independent testers) → Acceptance (users, alpha/beta)."], "dia": null}, {"unit": 7, "title": "Alpha and beta testing; test case vs test suite; code walkthrough", "kind": "comparison", "occ": [["D13", 5, "What is the main objective of code walkthrough?"], ["D14", 5, "Short note: Alpha and Beta testing"], ["N19", 3, "Difference between test case and test suite with example."]], "ans": ["**Alpha testing:** by end users at **developer's site**, controlled environment, developer present recording errors.", "**Beta testing:** at **customer sites**, developer not present, real environment, users report problems.", "**Test case:** one set of inputs, preconditions, expected result (e.g., login with valid ID → home page). **Test suite:** collection of related test cases (e.g., login suite).", "**Code walkthrough objective:** informal review where the author walks peers through the code to find errors, check standards and share knowledge – not to fix during the meeting."], "dia": null}, {"unit": 7, "title": "White-box vs black-box testing; control structure & loop testing", "kind": "comparison", "occ": [["D13", 10, "Why include BVA in black box test data? Is it important to perform both white box and black box testing?"], ["J14", null, "Explain White Box and Black Box Testing"], ["D14", 10, "Discuss the Control Structure Testing in white box testing."], ["D14R", null, "Explain White Box and Black Box Testing"], ["N18", 7, "Compare white box and black box testing."], ["J19", 7, "What is control structure testing? Explain loop testing with suitable diagrams."], ["N19", null, "Short note: Black Box versus White Box Testing"], ["N17", 7, "Short note: Black-box testing techniques"]], "ans": ["**White-box (glass-box):** tests internal logic using code structure – all independent paths, logical decisions T/F, loops at boundaries, internal data structures. Techniques: basis path, condition testing, data-flow testing, loop testing.", "**Black-box (behavioural):** tests functionality from requirements, no code knowledge – finds incorrect/missing functions, interface errors, data structure errors, performance & initialization errors. Techniques: equivalence partitioning, BVA, graph-based, orthogonal array.", "**Both needed:** they find different classes of errors – complementary.", "**Loop testing:** simple loops (skip, 1 pass, 2 passes, m passes, n-1, n, n+1), nested loops (start innermost), concatenated, unstructured loops (redesign)."], "dia": null}, {"unit": 7, "title": "Basis path testing / cyclomatic complexity (numerical)", "kind": "numerical", "occ": [["D15", null, "Draw the control flow graph for find-maximum function; determine cyclomatic complexity."], ["D16R", null, "Discuss Basis path testing; calculate cyclomatic complexity with an example."], ["M17", 12, "For calculate() program: control flow graph, cyclomatic complexity, basis set of paths, test cases."], ["N17", 7, "Use of Cyclomatic Complexity metric; determine V(G) for simplesubtract() using all methods."], ["N18", 7, "Design the flow graph and calculate cyclomatic complexity for given code."], ["N19", 7, "Calculate the cyclomatic complexity for the given program (max of a, b, c)."]], "ans": ["**Steps:** draw flow graph (nodes = statements/decisions, edges = control flow) → compute V(G) → list basis (independent) paths → design one test case per path.", "**V(G) = E − N + 2** = **P + 1** (P = predicate/decision nodes) = **number of regions**.", "simplesubtract(): one if-else → V(G) = 2. find-maximum (nested if-else, 3 decisions) → V(G) = 4. N19 program (2 ifs) → V(G) = 3. M17 calculate(): if(nextday) + 5 if-else-if decisions → V(G) = 7.", "**Use:** upper bound on number of tests for full branch coverage; measures complexity (V(G) > 10 = risky module)."], "dia": "Control flow graph (flow graph)"}, {"unit": 7, "title": "Equivalence partitioning & boundary value analysis", "kind": "numerical", "occ": [["D13", 10, "Why is it important to include boundary value analysis in black box test data?"], ["D15", null, "Explain Equivalence Partitioning and Boundary Value Analysis."], ["N17", 8, "4-digit integer input ≥ 2000 and ≤ 8000: determine test cases using ECP and BVA."]], "ans": ["**ECP:** divide input domain into classes where all values behave the same; one test per class.", "For 2000 ≤ x ≤ 8000: valid class 2000–8000 (e.g., 5000); invalid < 2000 (e.g., 1500); invalid > 8000 (e.g., 9000); invalid non-4-digit/non-integer (e.g., 'abc').", "**BVA:** errors cluster at edges – test min−1, min, min+1, max−1, max, max+1 → **1999, 2000, 2001, 7999, 8000, 8001**.", "BVA complements ECP by selecting test cases at the edges of each class."], "dia": null}, {"unit": 7, "title": "SQA – meaning, goals, SQA team role, SQA activities, 'SQA pays off'", "kind": "theory", "occ": [["J14", null, "What is meant by software quality assurance? Mention the goals of software quality group."], ["D14R", null, "What is meant by SQA? Mention the goals of the software quality group."], ["J15", null, "Explain 'Software Quality' and discuss SQA activities in detail."], ["D15", null, "Which activities are to be performed by SQA team?"], ["D16R", null, "Briefly explain the role of SQA team. Justify the term 'SQA activities pay off'."], ["N17", 7, "Short note: SQA Activities"], ["J19", 7, "List and explain the Software Quality Assurance tasks in detail."], ["N19", null, "Explain SQA and their activities in detail."], ["F24", 10, "Discuss the different Software Quality Assurance (SQA) activities in detail."]], "ans": ["**SQA:** planned, systematic pattern of actions to ensure software quality across the whole life cycle (prevent defects in process).", "**Goals:** requirements quality, design quality, code quality, quality-control effectiveness.", "**SQA group activities (Pressman):** prepare SQA plan; participate in the team's process description; review engineering activities for process compliance; audit work products; ensure deviations are documented & handled; record non-compliance and report to senior management.", "**Other activities:** standards, reviews & audits, testing, error/defect collection & analysis, change management, education, vendor management, security, safety, risk management.", "**Pays off:** cost of fixing a defect rises sharply in later phases (requirements → design → code → test → field); early SQA reviews cost far less than field failures."], "dia": null}, {"unit": 7, "title": "SQA vs software testing – roles, how they complement, prioritisation", "kind": "comparison", "occ": [["F24", 10, "How does SQA differ from software testing, and how do they complement each other?"], ["R25", 10, "Evaluate roles of SQA and testing; which to prioritize in a resource-constrained project?"]], "ans": ["**SQA:** process-oriented, **preventive**, entire SDLC, standards/reviews/audits.", "**Testing (QC):** product-oriented, **detective**, executes software to find defects; testing is one activity within SQA.", "**Complement:** SQA reduces defects injected; testing catches the remaining ones and gives data to improve the process.", "**Resource-constrained:** keep lightweight SQA (reviews, coding standards, checklists) + risk-based testing of critical features – justify with an example (banking app)."], "dia": null}, {"unit": 7, "title": "Software metrics – process & project metrics, size vs function oriented, design metrics", "kind": "theory", "occ": [["D13", 10, "Short note: Process and project metrics."], ["J14", null, "What are the metrics for software product, process and project?"], ["D14", 10, "Discuss function based metrics and component level design metrics."], ["D14R", null, "Explain size-oriented and function-oriented metrics for software."], ["D15", null, "Short note: Architectural Design Metrics"], ["D16", null, "What are the possible metrics attributes? Differentiate size-oriented and function-oriented metrics."], ["N17", 6, "What is a metric? List and explain the different project and process metrics."], ["J19", 7, "Explain process and project metrics; how they help the organization improve quality."]], "ans": ["**Metric:** quantitative measure of the degree to which a system/process possesses an attribute.", "**Process metrics:** collected across projects, long-term improvement – defect removal efficiency, errors before release, defects per KLOC, effort/time per activity, productivity.", "**Project metrics:** for one project – effort/schedule/cost variance, defects found, work products produced, progress (earned value) – adjust schedule & workflow.", "**Product metrics:** quality of the product – complexity (cyclomatic), size, cohesion/coupling, reliability (MTBF).", "**Size-oriented:** normalised by **LOC** – errors/KLOC, $/LOC, pages of doc/KLOC; simple but language-dependent.", "**Function-oriented:** normalised by **function points** – errors/FP, cost/FP; language-independent, usable early.", "**Design metrics:** architectural (structural complexity = fan-out², data complexity, system complexity), component-level (cohesion, coupling, complexity), function-based (FP).", "**Help improve quality:** objective data → identify weak areas, compare projects, predict effort, track improvement."], "dia": null}, {"unit": 7, "title": "Software reliability and availability", "kind": "theory", "occ": [["D13", 5, "Define system reliability and availability."], ["J14", null, "Define system reliability and availability."]], "ans": ["**Reliability:** probability of failure-free operation of a program for a specified time in a specified environment; measured by **MTBF = MTTF + MTTR**.", "**Availability:** probability that the program is operating according to requirements at a given point in time: **Availability = MTTF / (MTTF + MTTR) × 100%**."], "dia": null}, {"unit": 8, "title": "Function point (FP) estimation – numericals and process", "kind": "numerical", "occ": [["J15", null, "Note: Function Point Estimation with an example."], ["D15", null, "Effort 50 PM, productivity 12 FP/PM, ΣVAF 46 – calculate tentative EI, EO, EQ, ILF, EIF (weights 4,5,4,10,7)."], ["D16", null, "10 simple + 3 complex EI, 5 avg + 20 complex EO, 8 simple EQ, 10 avg ILF, 7 complex EIF, ΣFi = 51 – FP, effort (5 FP/pm) and cost ($2000/pm)."], ["D16R", null, "Calculate the function point for online railway ticket reservation system (assumptions)."], ["M17", 12, "Explain effort estimation using function point analysis with example; advantages."], ["N18", 7, "Find FP and cost for e-commerce app: EI 50, EO 40, EQ 35, ILF 6, EIF 4 (average)."], ["J19", 7, "Cost and time estimation for 'college admission system' using FP (avg weights 4,5,4,10,7)."], ["N19", 7, "FP for project: inputs 50, outputs 40, enquiries 35, files 6, interfaces 4; average weights; given adjustment factors."]], "ans": ["**FP = UFP × [0.65 + 0.01 × ΣFi]** (14 value adjustment factors, each 0–5).", "**UFP = Σ (count × weight)** – average weights: EI 4, EO 5, EQ 4, ILF 10, EIF 7 (simple: 3,4,3,7,5; complex: 6,7,6,15,10).", "Effort = FP / productivity; Cost = effort × labour rate; time from effort/team.", "**N18/N19 data (all average):** UFP = 50×4 + 40×5 + 35×4 + 6×10 + 4×7 = 200+200+140+60+28 = **628**; if ΣFi = 42 (all average = 3×14) → FP = 628 × 1.07 = **671.96**.", "**D16:** UFP = (10×3+3×6) + (5×5+20×7) + 8×3 + 10×10 + 7×10 = 48+165+24+100+70 = **407**; FP = 407 × (0.65+0.51) = **472.12**; effort = 472.12/5 ≈ **94.4 PM**; cost ≈ **$188,850**.", "**Advantages:** language-independent, early estimate from requirements, user-oriented."], "dia": null}, {"unit": 8, "title": "COCOMO II / LOC-based estimation", "kind": "numerical", "occ": [["D13", 10, "Short note: COCOMO-II model"], ["J14", null, "COCOMO II: 12 screens (weight 2), 10 reports (weight 5), 80 components (weight 10), productivity 13 – estimate effort."], ["D14R", null, "COCOMO II: 12 screens, 10 reports, 80 components, productivity 13 – estimate effort."], ["J15", null, "Explain the COCOMO-II estimation model."], ["N17", null, "Discuss with example COCOMO II model for software estimation."], ["N17", null, "7 functions LOC (2340, 5380, 6800, 3350, 4950, 2140, 8400), 620 LOC/pm, Rs 8000/month – total cost and effort."]], "ans": ["**COCOMO II application composition model:** object points = Σ(count × complexity weight); NOP = OP × (100 − %reuse)/100; Effort = NOP / PROD.", "**J14/D14R:** OP = 12×2 + 10×5 + 80×10 = 24 + 50 + 800 = **874**; assuming 0% reuse, effort = 874/13 ≈ **67.2 person-months**.", "Other COCOMO II models: early design stage, post-architecture stage (uses cost drivers & scale factors).", "**LOC numerical (N17):** total LOC = 33,360 → effort = 33,360/620 ≈ **53.8 PM**; cost ≈ 53.8 × 8000 ≈ **Rs 4.30 lakh**."], "dia": null}, {"unit": 8, "title": "Software Configuration Management (SCM) – process, repository, layers, SCIs", "kind": "theory", "occ": [["D13", 10, "How SCM facilitates change during the stages of SDLC; example at each stage."], ["J14", null, "Note: Software Configuration Management"], ["D14R", null, "Note: Software Configuration Management"], ["J15", null, "Note: SCM"], ["D15", null, "Note: Software Configuration Management Process"], ["D16R", null, "Note: Software configuration Management"], ["M17", 8, "What is SCM Repository? Discuss the different SCM tasks."], ["N17", 7, "Short note: Software configuration items"], ["N18", 7, "Explain the layers of SCM process with neat diagram."], ["J19", 7, "Explain the role and content of the SCM Repository with neat figure."], ["N19", null, "Short note: Software Configuration Management"]], "ans": ["**SCM:** set of activities to manage change – identify, control, implement and report changes across the life cycle.", "**SCIs:** information created during the process – programs, documents (SRS, design), data, test cases; baselines = reviewed & approved SCIs.", "**SCM process layers (Pressman):** Identification → Version control → Change control → Configuration audit → Status reporting (concentric layers around SCIs).", "**Repository:** central database storing SCIs with versions, relationships, audit trails; supports data integrity, sharing, tool integration, standards enforcement; content – business, model, construction, project, V&V content."], "dia": null}, {"unit": 8, "title": "Software reengineering and reverse engineering", "kind": "theory", "occ": [["D13", 10, "Explain Reverse Engineering and Re-Engineering with a block diagram."], ["J14", null, "Note: Re-engineering"], ["D14", 5, "Short note: Re-Engineering and Reverse Engineering"], ["D14R", null, "Note: Reengineering"], ["D15", null, "Note: Reengineering and Reverse Engineering"], ["D16", null, "Short note: Software Reengineering"], ["D16R", null, "Note: Reengineering and Reverse Engineering"], ["N19", null, "How is reverse engineering different from reengineering? Explain with diagram."]], "ans": ["**Reverse engineering:** analysing a program to recover design & specification at a higher abstraction level (code → design → requirements); doesn't change the system.", "**Reengineering:** rebuilding the system for better maintainability/new technology: **Inventory analysis → Document restructuring → Reverse engineering → Code restructuring → Data restructuring → Forward engineering** (cyclic model).", "Difference: reverse engineering = understanding; reengineering = understanding + transformation + forward engineering."], "dia": "Reengineering process model diagram"}, {"unit": 8, "title": "W5HH principle (project management)", "kind": "theory", "occ": [["D14", 5, "Short note: W5HH Principles"], ["D14R", null, "Explain W5HH principles."], ["J15", null, "Explain W5HH Principle with its applicability."], ["D16R", null, "Note: W5HH principles"], ["M17", 6, "Explain W5HH principle with respect to software project management."], ["N18", 7, "Short note: W5HH principles"]], "ans": ["Boehm's questions to define key project characteristics:", "**Why** is the system being developed? (business reason) · **What** will be done? (tasks/functionality) · **When** will it be done? (schedule, milestones) · **Who** is responsible? (roles) · **Where** are they located organisationally? · **How** will the job be done technically and managerially? · **How much** of each resource is needed? (estimation).", "Applicable to any project size; forms the basis of the project plan."], "dia": null}, {"unit": 8, "title": "Software risks – reactive/proactive strategies, identification and projection", "kind": "theory", "occ": [["D16", null, "Short note: Risk Identification and Risk projection"], ["M17", 5, "What are software risks? Discuss reactive and proactive risk strategies."]], "ans": ["**Risk:** uncertain event with potential loss (project, technical, business risks; known, predictable, unpredictable).", "**Reactive:** 'fire-fighting' – act only when problems occur. **Proactive:** identify risks early, assess probability & impact, rank, plan mitigation.", "**Identification:** risk item checklists – product size, business impact, customer, process, technology, environment, staff.", "**Projection (estimation):** probability & impact → risk table sorted by exposure; **RE = P × C**; RMMM plan (mitigation, monitoring, management)."], "dia": null}], "pred": [{"unit": 6, "q": "Explain the three golden rules of user interface design with suitable examples from a real application.", "marks": "10", "conf": "Very high", "why": "Golden rules asked in 14 of 20 papers; a Unit 6 (UI) question appeared in 6 of the 7 papers from 2022 onward (N22, J23, N23, F24, D24, R25). Dec 2025 had no UI question at all, so Unit 6 is overdue.", "ans": ["**Place user in control:** undo/redo, cancel/interrupt, flexible input modes, customisation, hide internals, direct manipulation.", "**Reduce memory load:** defaults, autocomplete, shortcuts, real-world metaphors, progressive disclosure.", "**Consistency:** same layout/icons/shortcuts across screens & app family; keep familiar models (Ctrl+S).", "Give one example per rule (e.g., Gmail: undo send, autocomplete addresses, same toolbar everywhere)."]}, {"unit": 4, "q": "Design DFD Level 0, Level 1 (and Level 2) for a given online system (e.g., hospital / hotel / food delivery).", "marks": "10", "conf": "Very high", "why": "Most repeated question: DFD design in 14 of 20 papers, including 5 of the 7 papers since 2022 (N22, J23, N23, R25, D25); D24 asked DFD vs CFD evaluation.", "ans": ["Level 0: one process 'X System' + external entities (User, Admin, Payment gateway) + main flows.", "Level 1: 5–7 numbered processes (Login, Search, Order/Book, Payment, Notify, Reports) + data stores.", "Level 2: break one process (e.g., Payment 4.1–4.4).", "Follow balancing rules; label every flow; state assumptions."]}, {"unit": 3, "q": "Design a sequence diagram for a given scenario (e.g., online banking fund transfer / hotel booking).", "marks": "10", "conf": "Very high", "why": "Sequence-diagram design in N22, N23, F24, D24, D25 – 5 of the last 7 papers, including the last three finals.", "ans": ["Actors/objects across the top: User, UI (boundary), Controller, Entities (Account, DB), external services.", "Lifelines, activation bars, synchronous calls & dashed returns, numbered in time order.", "Use alt (success/fail) and loop fragments; end with confirmation message."]}, {"unit": 3, "q": "Draw a state machine diagram for a given object/system (e.g., vending machine, online order, elevator).", "marks": "10", "conf": "High", "why": "State diagram design in J23, D24, D25 (consecutive finals D24 → D25) and 6 papers overall.", "ans": ["Initial state ● → states with entry/do/exit actions → final ◉.", "Transitions labelled event [guard] / action; include a composite state if possible.", "Order example: Created → Paid → Packed → Shipped → Delivered; Cancelled from Created/Paid; Returned from Delivered."]}, {"unit": 7, "q": "Compare verification and validation. Which would you prioritise under limited resources? Give examples.", "marks": "10 (or 5)", "conf": "High", "why": "Asked in N23, F24, D24, R25 (4 consecutive papers) but skipped in Dec 2025 – strong return candidate.", "ans": ["Verification = building product right (reviews, inspections, static analysis); validation = right product (UAT, beta, prototype).", "Table: objective, focus, timing, activities, method (static+dynamic vs dynamic), example.", "Both needed; early verification cheaper, validation ensures acceptance."]}, {"unit": 7, "q": "Describe McCall's quality factors (quality triangle) and apply them to evaluate a given product.", "marks": "10", "conf": "High", "why": "8 papers; N22, F24, D24 recently; absent from R25 and D25, so it alternates back in.", "ans": ["Operation: correctness, reliability, efficiency, integrity, usability.", "Revision: maintainability, flexibility, testability.", "Transition: portability, reusability, interoperability.", "Draw triangle; give a metric per factor; prioritise per product type."]}, {"unit": 7, "q": "Explain SQA activities / How does SQA differ from testing and how do they complement each other?", "marks": "10", "conf": "High", "why": "SQA asked in 9 papers; F24 and R25 had SQA questions, D24 and D25 skipped it.", "ans": ["SQA plan, process description, reviews, audits, deviation handling, non-compliance reporting, metrics, training, risk, continuous improvement.", "SQA = process/preventive; testing = product/detective; testing is part of SQA.", "Complementary: prevention + detection."]}, {"unit": 2, "q": "Explain the Spiral model with diagram. Why is it called a meta model? How is the number of loops decided?", "marks": "10", "conf": "High", "why": "7 papers; J23, F24 (twice), D24 – but not in R25 or D25.", "ans": ["Boehm's risk-driven model; quadrants: objectives, risk analysis/prototype, development & test, plan next loop.", "Meta model – includes waterfall, incremental, prototyping.", "Loops not fixed – based on risk.", "Pros/cons; best for large high-risk systems."]}, {"unit": 2, "q": "Explain Scrum: roles, artifacts, events; how sprints and backlog handle changing requirements.", "marks": "10", "conf": "Very high", "why": "11 papers – most repeated SDLC topic; appeared in J23, N23, F24, D24 and twice in D25.", "ans": ["Roles: Product Owner, Scrum Master, Dev Team.", "Artifacts: product backlog, sprint backlog, increment.", "Events: sprint planning, daily scrum, review, retrospective; diagram.", "Change enters product backlog; re-prioritised between sprints."]}, {"unit": 7, "q": "Explain the ISO 9126 quality model and its characteristics (sub-characteristics).", "marks": "10", "conf": "High", "why": "Asked in the last three finals in a row (N23, D24, D25).", "ans": ["Six characteristics: functionality, reliability, usability, efficiency, maintainability, portability – list sub-characteristics.", "Relate to a scenario (banking, cybersecurity, mobile app) and justify priority."]}, {"unit": 7, "q": "Why is integration testing required? Explain top-down and bottom-up integration with stubs and drivers.", "marks": "10", "conf": "Medium-high", "why": "F24 and R25 asked it; skipped D24 and D25. 6 papers overall.", "ans": ["Interface errors, data loss, side-effects only appear when modules combine.", "Top-down uses stubs; bottom-up uses drivers & clusters; pros/cons.", "Smoke testing; example of interface mismatch."]}, {"unit": 7, "q": "Explain unit testing with a unit test environment (driver, stub) and design test cases for a given module.", "marks": "5 or 10", "conf": "High", "why": "N22, J23, N23, D25 – appears almost every final; Q1(d) in N23 and D25.", "ans": ["Smallest unit in isolation; tests interface, local data, boundaries, independent paths, error paths.", "Driver → module → stubs diagram.", "Test-case table: ID, input, expected output, type (positive/negative/boundary)."]}, {"unit": 3, "q": "Design an activity diagram (with swimlanes) for a given system.", "marks": "10", "conf": "Medium-high", "why": "J23, N23, D24 designed activity diagrams; R25 and D25 skipped – likely to return.", "ans": ["Initial node, actions, decision/merge with guards, fork/join for parallel steps, swimlanes, final node.", "Cover at least 5 activities and one alternate path."]}, {"unit": 3, "q": "Design a class diagram for a given system and explain the relationships (association, aggregation, composition, generalization).", "marks": "10", "conf": "Medium-high", "why": "Class diagram design in N22, J23, F24; D25 asked only relationships (5M) – full design likely again.", "ans": ["Classes with attributes/operations & visibility.", "Relationships with symbols + multiplicity.", "State assumptions."]}, {"unit": 4, "q": "Explain the phases of requirements engineering (elicitation, negotiation – win-win, validation).", "marks": "10 (or 5)", "conf": "Medium-high", "why": "8 papers; N22, J23, N23, D25 – roughly alternating, asked in the latest final.", "ans": ["Inception, elicitation, elaboration, negotiation, specification, validation, management.", "Win-win negotiation; elicitation techniques; validation checklist."]}, {"unit": 5, "q": "What is software architecture? Explain architectural styles (data-centered, data-flow, call-and-return, layered, object-oriented) with diagrams.", "marks": "10", "conf": "Medium-high", "why": "Architecture-style questions in N22, J23, N23, D24 (8 papers for the general styles question); F24, R25 and D25 skipped the classic styles question.", "ans": ["Definition & importance.", "Each style: diagram, components/connectors, example.", "Compare performance/scalability if asked."]}, {"unit": 2, "q": "Compare Agile vs traditional/plan-driven models; explain XP practices (pair programming, refactoring, spike, velocity).", "marks": "5 or 10", "conf": "Medium", "why": "XP in 9 papers (N22, J23, N23, R25 recently); agile vs traditional N22 and D25.", "ans": ["Comparison table (requirements, delivery, customer, documentation, change, team).", "XP activities: planning, design, coding, testing; key practices."]}, {"unit": 2, "q": "Explain the RAD model; compare RAD with Incremental / Prototyping (time box, parallel teams).", "marks": "5 or 10", "conf": "Medium", "why": "RAD in three consecutive papers F24, D24, D25.", "ans": ["Phases with parallel teams, 60–90 day time box, component reuse.", "Comparison on speed, modularity, team size, risk."]}, {"unit": 4, "q": "Compare data flow model and control flow model; draw a CFD for a real-time system.", "marks": "10", "conf": "Medium", "why": "D24 and R25 both asked DFD vs CFD evaluation; CFD design not asked since 2019 – topic in syllabus.", "ans": ["DFD = data transformation; CFD = events/control with CSPEC.", "Real-time/embedded → control flow; business → data flow.", "Draw CFD with dashed control flows and state diagram in CSPEC."]}, {"unit": 1, "q": "Explain software characteristics / software deterioration vs hardware wear out (failure curves).", "marks": "5", "conf": "Medium", "why": "Q1 short question pattern: N23 (characteristics) and D24 (deterioration); also legacy software N22, D25.", "ans": ["Developed not manufactured; doesn't wear out but deteriorates; custom built.", "Draw bathtub curve vs software idealised/actual curve with change spikes."]}, {"unit": 4, "q": "Explain how the analysis model is translated into the design model (design pyramid).", "marks": "10", "conf": "Medium", "why": "6 papers; most recently R25. Core Unit 4 topic.", "ans": ["Analysis elements (scenario, class, behavioural, flow) → data, architectural, interface, component design.", "Draw the translation diagram."]}, {"unit": 5, "q": "Explain transform mapping / mapping data flow into a call-and-return architecture; horizontal & vertical partitioning.", "marks": "10", "conf": "Medium-low", "why": "Not asked since J23 (transform mapping) and J19 (partitioning) – a 'skipped topic' that is still in Unit 5.", "ans": ["Steps: review DFD, determine transform flow, isolate transform centre, first & second level factoring, refine.", "Horizontal: input/process/output branches; vertical: control at top, workers at bottom."]}, {"unit": 6, "q": "Explain the user interface design process/steps and the four UI models (user, design, mental, implementation).", "marks": "10", "conf": "Medium", "why": "UI models asked in D16R and J19; design steps in J23 – not seen since, while UI questions recur every year.", "ans": ["Process: analysis → design → construction → validation.", "Steps: define objects/actions, events, states, interpretation.", "Four models explained."]}, {"unit": 4, "q": "Explain design concepts: abstraction, modularity, functional independence – cohesion and coupling.", "marks": "5 or 10", "conf": "Low-medium", "why": "Asked in 2013–2017 papers only; still part of Unit 4 'Design' – possible short question.", "ans": ["Abstraction (procedural, data), modularity, information hiding.", "High cohesion + low coupling; types of each (best to worst)."]}, {"unit": 7, "q": "Explain levels of testing and system testing types (recovery, security, stress, performance, deployment).", "marks": "10", "conf": "Medium", "why": "System testing N22; levels R25 – D25 had only unit testing.", "ans": ["Unit → integration → system → acceptance; scope/objective of each.", "Five system test types with one line each."]}, {"unit": 3, "q": "Compare sequence and collaboration diagrams (5 parameters) / structural vs behavioral UML diagrams.", "marks": "5 or 10", "conf": "Medium", "why": "Seq vs collaboration J23, N23, F24; structural vs behavioral N23; UML OOA/OOD D25.", "ans": ["Table: emphasis, layout, order, elements, best use.", "Structural (class, object, component, deployment, package) vs behavioral (use case, activity, state, interaction)."]}], "defs": [["Software", 1, "Computer programs + data structures + documentation that together provide required function and performance."], ["Software engineering", 1, "Application of a systematic, disciplined, quantifiable approach to the development, operation and maintenance of software (IEEE)."], ["Legacy software", 1, "Older, business-critical software that is still in use and continually modified; often poorly designed and documented."], ["Software deterioration", 1, "Rise in failure rate caused by defects introduced through repeated changes – software doesn't wear out but deteriorates."], ["Umbrella activities", 1, "Activities applied throughout a project (tracking, risk mgmt, SQA, reviews, measurement, SCM, reuse, work products)."], ["Software myth", 1, "Widely held but false belief about software (management, customer, practitioner myths)."], ["Prescriptive process model", 2, "Model that prescribes a defined set of activities, actions, work products and workflow (e.g., waterfall)."], ["Incremental model", 2, "Delivers software in increments; first increment is the core product; each increment adds functionality."], ["Spiral model", 2, "Boehm's risk-driven evolutionary model combining prototyping with systematic waterfall steps in loops."], ["Meta model", 2, "A model that subsumes other models – the spiral can act as waterfall, incremental or prototyping."], ["Time box (RAD)", 2, "Fixed time period (typically 60–90 days) in which a RAD module must be delivered."], ["Agility", 2, "Ability to respond to change quickly with customer collaboration and frequent delivery of working software."], ["Sprint", 2, "Time-boxed iteration (2–4 weeks) in Scrum that produces a potentially shippable increment."], ["Product backlog", 2, "Prioritised list of all features/requirements owned by the Product Owner."], ["Scrum Master", 2, "Facilitator who ensures Scrum is followed and removes impediments for the team."], ["Pair programming", 2, "XP practice: two developers at one workstation – driver writes code, navigator reviews in real time."], ["Refactoring", 2, "Improving internal structure of code without changing its external behaviour."], ["Spike solution", 2, "Quick prototype in XP to explore a risky design problem."], ["Project velocity", 2, "Number of user stories implemented in a release; used to estimate future releases."], ["CMMI", 2, "SEI model rating process maturity on 5 levels: Initial, Managed, Defined, Quantitatively Managed, Optimizing."], ["UML", 3, "Unified Modeling Language – standard visual language to specify, construct and document software systems."], ["Event (UML)", 3, "Occurrence that can trigger a state transition: call, signal, time or change event."], ["Lifeline", 3, "Dashed vertical line in a sequence diagram representing an object's existence over time."], ["Aggregation vs composition", 3, "Aggregation = weak whole–part (parts can exist alone, ◇); composition = strong ownership (parts die with whole, ◆)."], ["Requirement engineering", 4, "Process of inception, elicitation, elaboration, negotiation, specification, validation and management of requirements."], ["Win-win negotiation", 4, "Negotiation where customer gets most needs satisfied and developers get realistic budget and deadlines."], ["SRS", 4, "Software Requirements Specification – complete, unambiguous, verifiable description of what the system must do."], ["DFD", 4, "Graphical model of how data flows through processes, stores and external entities."], ["CFD / CSPEC", 4, "Control flow diagram shows events & control flows; the control specification describes behaviour with state diagrams/tables."], ["Abstraction", 4, "Concentrating on essential characteristics while ignoring details (procedural and data abstraction)."], ["Cohesion", 4, "Degree to which elements within a module belong together – aim high (functional cohesion)."], ["Coupling", 4, "Degree of interdependence between modules – aim low (data coupling)."], ["Structure chart", 4, "Hierarchical diagram of modules, calls and data/control couples."], ["Software architecture", 5, "Structure of a system: components, their externally visible properties, and relationships among them."], ["Architectural style", 5, "Template describing components, connectors, constraints and semantics for a family of systems (e.g., layered)."], ["Architectural pattern", 5, "Solution to a specific recurring architectural problem within a style (e.g., MVC, broker)."], ["Transform mapping", 5, "Technique to map DFDs with transform flow into a call-and-return program structure."], ["Golden rules", 6, "Mandel's three UI rules: place the user in control, reduce memory load, make the interface consistent."], ["Mental model", 6, "User's image of the system in their head."], ["Software quality", 7, "Conformance to explicit requirements, development standards and implicit expectations of professional software."], ["Verification", 7, "Are we building the product right? – conformance to specifications."], ["Validation", 7, "Are we building the right product? – meets customer needs."], ["Unit testing", 7, "Testing the smallest unit of design in isolation using drivers and stubs."], ["Driver / Stub", 7, "Driver = dummy calling program that feeds test data; stub = dummy called module that returns minimal data."], ["Integration testing", 7, "Systematic technique to build the program structure while testing interfaces between modules."], ["Smoke testing", 7, "Daily-build integration test that checks main functions to expose show-stopper errors early."], ["Regression testing", 7, "Re-running tests after changes to ensure no new errors were introduced."], ["Alpha / Beta testing", 7, "Alpha at developer site with users; beta at customer sites without developer."], ["SQA", 7, "Planned, systematic set of activities ensuring the software process and products conform to requirements and standards."], ["Cyclomatic complexity", 7, "V(G) = E − N + 2 = P + 1 = number of regions; number of independent paths."], ["Reliability / Availability", 7, "Reliability = probability of failure-free operation for time t (MTBF = MTTF + MTTR); Availability = MTTF/(MTTF+MTTR)."], ["Defect Removal Efficiency", 7, "DRE = E / (E + D), E = errors before release, D = defects after release."]], "rev": {"1": ["Software = programs + data + documentation; developed not manufactured; deteriorates (not wears out); custom built.", "Hardware bathtub curve vs software idealised/actual curve (spikes after change).", "Categories: system, application, engineering/scientific, embedded, product-line, web/mobile, AI.", "Generic (market owns spec) vs customised (customer owns spec).", "Legacy software: old, critical, poor docs – evolve for new environments, business needs, interoperability.", "Myths: management (books, add people), customer (vague objectives, easy change), practitioner (done when runs, no early quality check).", "Framework: communication, planning, modeling, construction, deployment + 8 umbrella activities."], "2": ["Waterfall: linear, prescriptive, needs stable requirements; late feedback = high risk.", "Incremental: core product first, staggered linear sequences; early delivery.", "Prototyping: unclear requirements; quick design; risk of throwaway being shipped.", "Spiral: Boehm, risk-driven, 4 quadrants, meta model, loops not fixed.", "RAD: 60–90 day time box, parallel teams, component reuse; needs modularity & many people.", "Agile: 12 principles, welcome change, working software, self-organizing teams; 3 assumptions.", "XP: planning (stories, velocity) → design (KIS, CRC, spike, refactoring) → coding (test-first, pair) → testing (CI, acceptance).", "Scrum: PO, SM, team; product & sprint backlog; sprint planning, daily scrum, review, retrospective.", "CMMI: Initial → Managed → Defined → Quantitatively Managed → Optimizing; doesn't guarantee quality."], "3": ["Structural: class, object, component, deployment, package. Behavioral: use case, activity, state, sequence, communication, timing.", "Class relationships: association, aggregation ◇, composition ◆, generalization △, dependency, realization + multiplicity.", "Sequence: lifelines, activations, messages in time order, alt/loop fragments.", "Collaboration: objects + links + numbered messages (structure focus).", "Activity: initial, actions, decisions, fork/join, swimlanes, final.", "State: states, event [guard]/action, composite states; events: call, signal, time, change.", "Use case: actors, use cases, boundary, include/extend."], "4": ["RE tasks: inception, elicitation, elaboration, negotiation (win-win), specification, validation, management.", "FR = what the system does; NFR = performance, security, usability, reliability…", "SRS qualities: correct, unambiguous, complete, consistent, verifiable, modifiable, traceable.", "DFD notation: entity □, process ○, flow →, store =; levels 0/1/2 with balancing.", "CFD: dashed control flows + CSPEC (state diagram / activation table) for real-time systems.", "Analysis model (scenario, class, behaviour, flow) → design pyramid (data, architecture, interface, component).", "High cohesion + low coupling = good design; abstraction, modularity, information hiding.", "Structure chart (modules & calls) vs flowchart (logic steps)."], "5": ["Architecture = components + properties + relationships; important for communication, early decisions, reuse.", "Styles: data-centered (repository/blackboard), data-flow (pipe & filter), call & return, object-oriented, layered.", "Style vs pattern: system-level template vs recurring solution inside it.", "Partitioning: horizontal (input/process/output) and vertical (control at top, workers at bottom).", "Transform mapping: isolate transform centre → first-level factoring → second-level factoring → refine.", "Data warehouse/mining → separate analytical store, ETL, schemas, scalability decisions."], "6": ["Golden rules: user in control, reduce memory load, consistency (with examples).", "Four models: user, design, mental, implementation.", "UI process: analysis → design → construction → validation.", "Design steps: objects & actions, events, states, how user interprets state.", "Design issues: response time, help, error handling, labelling, accessibility, internationalisation."], "7": ["Quality = conformance to explicit requirements, standards and implicit expectations.", "McCall: operation (CREIU), revision (MFT), transition (PRI).", "ISO 9126: functionality, reliability, usability, efficiency, maintainability, portability + sub-characteristics.", "V&V: product right vs right product.", "Strategy: unit → integration → validation → system.", "Unit: driver → module → stubs; tests interface, local data, boundaries, paths, error handling.", "Integration: top-down (stubs) vs bottom-up (drivers); smoke testing.", "System testing: recovery, security, stress, performance, deployment.", "SQA: plan, reviews, audits, deviations, reporting; prevention vs testing's detection.", "Metrics: process (long-term) vs project (one project); size-oriented (LOC) vs function-oriented (FP).", "V(G) = E − N + 2 = P + 1; BVA: min−1, min, min+1, max−1, max, max+1."]}}</script>
<script>
(function(){
"use strict";
var D = JSON.parse(document.getElementById("data").textContent);
var P = {}; D.papers.forEach(function(p){ P[p.code] = p; });
var RECENT = ["N22","J23","N23","F24","D24","R25","D25"];
var KIND = {theory:"Theory", diagram:"Diagram / Design", numerical:"Numerical", comparison:"Comparison"};
var main = document.getElementById("main");

function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function md(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>"); }
function ucol(u){ return "var(--u"+u+")"; }
function unitName(u){ return D.units[String(u)]; }
function unitShort(u){ return u==8 ? "Other" : "Unit "+u; }

// ---------- derived stats per group ----------
D.groups.forEach(function(g,i){
  g.id = "q"+(i+1);
  var ps = {}; g.occ.forEach(function(o){ ps[o[0]] = 1; });
  g.papers = Object.keys(ps).sort(function(a,b){ return P[a].sort - P[b].sort; });
  g.freq = g.papers.length;
  g.recent = g.papers.filter(function(c){ return RECENT.indexOf(c) >= 0; }).length;
  var ms = {}; g.occ.forEach(function(o){ if(o[1] != null) ms[o[1]] = 1; });
  g.marks = Object.keys(ms).map(Number).sort(function(a,b){return a-b;});
  g.maxm = g.marks.length ? g.marks[g.marks.length-1] : 0;
  g.last = P[g.papers[g.papers.length-1]].sort;
  g.score = g.freq*10 + g.recent*8 + Math.min(g.maxm,10) + (g.unit==8 ? -25 : 0);
});

function yearsChips(g){
  return g.papers.map(function(c){ return '<span class="chip y">'+esc(P[c].label)+'</span>'; }).join("");
}
function marksText(g){
  var t = g.marks.length ? g.marks.join(" / ")+" M" : "marks not printed";
  if (g.marks.length && g.occ.some(function(o){return o[1]==null;})) t += " (+ unprinted)";
  return t;
}
function answerHTML(lines){
  var out = "", rows = [], list = [];
  function flushList(){ if(list.length){ out += '<ul class="ans">'+list.map(function(l){return "<li>"+md(l)+"</li>";}).join("")+"</ul>"; list = []; } }
  function flushRows(){ if(rows.length){
      var h = rows[0], b = rows.slice(1);
      out += '<div class="tbl"><table><thead><tr>'+h.map(function(c){return "<th>"+md(c)+"</th>";}).join("")+"</tr></thead><tbody>"+
        b.map(function(r){return "<tr>"+r.map(function(c){return "<td>"+md(c)+"</td>";}).join("")+"</tr>";}).join("")+"</tbody></table></div>";
      rows = []; } }
  lines.forEach(function(l){
    if (/^\|/.test(l)){ flushList(); rows.push(l.replace(/^\||\|\s*$/g,"").split("|").map(function(c){return c.trim();})); }
    else { flushRows(); list.push(l); }
  });
  flushRows(); flushList();
  return out;
}
function qcard(g, prefix, rank){
  var hot = g.freq >= 6 || g.recent >= 3;
  var s = '<details class="q" data-unit="'+g.unit+'" id="'+prefix+g.id+'"><summary>'+
    '<span class="qt">'+(rank ? '<span class="rank">#'+rank+'</span>' : '')+md(g.title)+'</span>'+
    '<span class="meta">'+
      '<span class="chip freq">Asked ×'+g.freq+'</span>'+
      (hot ? '<span class="chip hot">★ High priority</span>' : '')+
      '<span class="chip unit" style="--uc:'+ucol(g.unit)+'">'+unitShort(g.unit)+'</span>'+
      '<span class="chip">'+esc(marksText(g))+'</span>'+
      '<span class="chip">'+KIND[g.kind]+'</span>'+
    '</span>'+
    '<span class="meta">'+yearsChips(g)+'</span>'+
  '</summary><div class="body">'+
    '<h4>Asked as (past-paper wording)</h4><ul class="asked">'+
    g.occ.slice().sort(function(a,b){return P[a[0]].sort-P[b[0]].sort;}).map(function(o){
      return '<li><b>'+esc(P[o[0]].label)+'</b> · '+(o[1]!=null ? o[1]+' M' : 'marks not printed')+' — '+esc(o[2])+'</li>';
    }).join("")+'</ul>'+
    '<h4>Exam answer</h4>'+answerHTML(g.ans)+
  '</div></details>';
  return s;
}

var H = [];
// ---------- HOME ----------
var totalOcc = D.groups.reduce(function(a,g){return a+g.occ.length;},0);
var inSyl = D.groups.filter(function(g){return g.unit<8;});
H.push('<section id="home"><h1>Software Engineering <span style="background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent">Exam Prep</span></h1>'+
 '<p class="sub">Every question from '+D.papers.length+' unique MPSTME Software Engineering papers (Dec 2013 → Dec 2025), merged, ranked and answered.</p>'+
 '<div class="glass hero"><div class="stats">'+
  '<div class="stat"><b>'+D.papers.length+'</b><span>unique papers analysed</span></div>'+
  '<div class="stat"><b>'+totalOcc+'</b><span>question occurrences</span></div>'+
  '<div class="stat"><b>'+D.groups.length+'</b><span>merged question topics</span></div>'+
  '<div class="stat"><b>'+D.pred.length+'</b><span>predicted questions</span></div>'+
 '</div>'+
 '<div class="note"><b>How to use:</b> tap any question to open its past-paper wordings and a point-form answer. <b>Asked ×N</b> = number of different papers it appeared in. Use search for any topic or year (e.g. “2024”, “DFD”).</div>'+
 '<div class="note warn"><b>About the source:</b> the PDF is 47 scanned pages; 5 pages are duplicate scans (counted once) and 1 page is blank. Some older papers (2014–2019) don\'t print marks next to each question – these are shown as “marks not printed”. Questions on estimation, SCM, risk, W5HH and re-engineering appear in older papers but are outside your 7 units – they are kept in a separate “Other” group.</div>'+
 '</div></section>');

// ---------- TOP ----------
var top = D.groups.filter(function(g){return g.unit<8;}).slice().sort(function(a,b){return b.score-a.score || b.freq-a.freq;}).slice(0,25);
H.push('<section id="top"><h2>Top Questions</h2><p class="sub">Ranked by repetition (papers asked), appearances in the 7 papers since 2022, and marks. Only your 7 syllabus units.</p>'+
  top.map(function(g,i){ return qcard(g,"t",i+1); }).join("")+'</section>');

// ---------- BANK ----------
var b = '<section id="bank"><h2>Unit-wise Question Bank</h2><p class="sub">All past-paper questions, merged by topic. Variations are listed inside each card.</p>'+
  '<div class="toolbar" id="unitfilter"><button class="btn on" data-u="all">All</button>';
for (var u=1; u<=8; u++) b += '<button class="btn" data-u="'+u+'">'+unitShort(u)+'</button>';
b += '<button class="btn" id="expandall">Expand all</button><button class="btn" id="collapseall">Collapse all</button></div>';
for (u=1; u<=8; u++){
  var gs = D.groups.filter(function(g){return g.unit==u;}).sort(function(a,c){return c.freq-a.freq || c.recent-a.recent;});
  var n = gs.reduce(function(a,g){return a+g.occ.length;},0);
  b += '<div class="unitblock" data-unit="'+u+'"><div class="unithead" style="--uc:'+ucol(u)+'"><span class="dot"></span><h3>'+unitShort(u)+' · '+esc(unitName(u))+'</h3></div>'+
       '<small style="color:var(--muted)">'+gs.length+' topics · '+n+' occurrences</small>'+gs.map(function(g){return qcard(g,"b");}).join("")+'</div>';
}
b += '</section>';
H.push(b);

// ---------- PREDICTED ----------
H.push('<section id="pred"><h2>Predicted Questions</h2><p class="sub">Not past-paper questions. These are predictions based on repetition, alternating patterns, topics skipped in recent papers and syllabus coverage.</p>'+
 '<div class="note warn"><b>Predicted ≠ guaranteed.</b> Reasons quote the real paper data. Try answering first, then open “Reveal answer”.</div>'+
 D.pred.map(function(p,i){
   var c = p.conf.split(/[ -]/)[0];
   return '<details class="q pred" data-unit="'+p.unit+'" id="p'+(i+1)+'"><summary><span class="qt"><span class="rank">P'+(i+1)+'</span>'+md(p.q)+'</span>'+
     '<span class="meta"><span class="chip unit" style="--uc:'+ucol(p.unit)+'">'+unitShort(p.unit)+'</span><span class="chip">Expected '+esc(p.marks)+' M</span><span class="chip conf-'+c+'">Confidence: '+esc(p.conf)+'</span><span class="chip">PREDICTED</span></span></summary>'+
     '<div class="body"><p class="why"><b>Why:</b> '+md(p.why)+'</p><details class="reveal"><summary>Reveal answer</summary><div>'+answerHTML(p.ans)+'</div></details></div></details>';
 }).join("")+'</section>');

// ---------- 5 / 10 MARK ----------
function linkItem(g){ return '<li><a href="#b'+g.id+'" data-open="b'+g.id+'">'+md(g.title)+'</a> <span class="chip freq">×'+g.freq+'</span> <span class="chip unit" style="--uc:'+ucol(g.unit)+'">'+unitShort(g.unit)+'</span></li>'; }
var five = D.groups.filter(function(g){return g.unit<8 && g.occ.some(function(o){return o[1]!=null && o[1]<=6;});}).sort(function(a,c){return c.freq-a.freq;});
var ten = D.groups.filter(function(g){return g.unit<8 && g.occ.some(function(o){return o[1]!=null && o[1]>=7;});}).sort(function(a,c){return c.freq-a.freq;});
H.push('<section id="marks"><h2>5-Mark & 10-Mark Questions</h2><p class="sub">Based on marks printed in the papers. Tap a question to jump to its answer.</p>'+
 '<div class="two"><div class="glass hero"><h3 style="margin-top:0">5-mark style (≤ 6 M) · '+five.length+'</h3><ul class="linklist">'+five.map(linkItem).join("")+'</ul></div>'+
 '<div class="glass hero"><h3 style="margin-top:0">10-mark style (7–12 M) · '+ten.length+'</h3><ul class="linklist">'+ten.map(linkItem).join("")+'</ul></div></div>'+
 '<div class="note"><b>Answer length:</b> 5 M → definition + 4–5 points + example (½ page). 10 M → definition + full points + diagram/table + example + conclusion (1½–2 pages). Older papers used 3/4/6/7/12-mark splits.</div></section>');

// ---------- COMPARISONS ----------
var comps = D.groups.filter(function(g){return g.unit<8 && (g.kind=="comparison" || / vs |versus/i.test(g.title));});
H.push('<section id="comp"><h2>Frequently Asked Comparisons</h2><p class="sub">'+comps.length+' comparison-type topics. Answers contain ready-to-write tables.</p>'+
 comps.sort(function(a,c){return c.freq-a.freq;}).map(function(g){return qcard(g,"c");}).join("")+'</section>');

// ---------- DEFINITIONS ----------
H.push('<section id="defs"><h2>Important Definitions</h2><p class="sub">One-liners to learn word-for-word.</p><div class="grid">'+
 D.defs.map(function(d){ return '<div class="card def" data-unit="'+d[1]+'"><h4><span class="chip unit" style="--uc:'+ucol(d[1])+'">'+unitShort(d[1])+'</span> '+esc(d[0])+'</h4><p>'+md(d[2])+'</p></div>'; }).join("")+'</div></section>');

// ---------- REVISION ----------
var rv = '<section id="rev"><h2>Last-Minute Revision</h2><p class="sub">Read this the night before the exam.</p><div class="grid">';
for (u=1; u<=7; u++){ rv += '<div class="card rev" data-unit="'+u+'" style="border-top:4px solid '+ucol(u)+'"><h4>'+unitShort(u)+' · '+esc(unitName(u))+'</h4><ul>'+D.rev[String(u)].map(function(l){return "<li>"+md(l)+"</li>";}).join("")+'</ul></div>'; }
rv += '<div class="card rev" style="border-top:4px solid var(--accent)"><h4>Exam strategy</h4><ul>'+
  '<li>Q1 is compulsory (4 × 5 M) – usually one question from Units 1/2, 3, 4/6 and 7.</li>'+
  '<li>Attempt 4 of Q2–Q7 (each 2 × 10 M). Pick the questions with a diagram you can draw well.</li>'+
  '<li>Every recent paper has at least one UML design + one DFD/design diagram – practise both.</li>'+
  '<li>Always draw: process model diagram, McCall triangle, unit-test environment, DFD levels.</li></ul></div></div></section>';
H.push(rv);

// ---------- ANALYTICS ----------
var perUnit = {}, perUnitRecent = {}, kinds = {}, perPaper = {};
D.groups.forEach(function(g){
  g.occ.forEach(function(o){
    perUnit[g.unit] = (perUnit[g.unit]||0)+1;
    if (RECENT.indexOf(o[0])>=0) perUnitRecent[g.unit] = (perUnitRecent[g.unit]||0)+1;
    perPaper[o[0]] = perPaper[o[0]] || {}; perPaper[o[0]][g.unit] = (perPaper[o[0]][g.unit]||0)+1;
  });
  kinds[g.kind] = (kinds[g.kind]||0)+g.occ.length;
});
function bars(obj, labels){
  var max = 0; Object.keys(obj).forEach(function(k){ if(obj[k]>max) max = obj[k]; });
  return '<div class="bars">'+Object.keys(labels).filter(function(k){return obj[k];}).map(function(k){
    return '<div class="barrow"><span class="lbl" title="'+esc(labels[k])+'">'+esc(labels[k])+'</span><span class="track"><span class="fill" style="display:block;width:'+(100*obj[k]/max).toFixed(1)+'%"></span></span><b>'+obj[k]+'</b></div>';
  }).join("")+'</div>';
}
var ulabels = {}; for (u=1; u<=8; u++) ulabels[u] = unitShort(u)+" · "+unitName(u).split(" (")[0];
var an = '<section id="analytics"><h2>Exam Analytics</h2><p class="sub">Computed directly from the extracted questions.</p>'+
 '<div class="two"><div class="glass hero"><h3 style="margin-top:0">Occurrences per unit (all papers)</h3>'+bars(perUnit,ulabels)+'</div>'+
 '<div class="glass hero"><h3 style="margin-top:0">Occurrences per unit (2022–2025 papers)</h3>'+bars(perUnitRecent,ulabels)+'</div></div>'+
 '<div class="glass hero" style="margin-top:14px"><h3 style="margin-top:0">Question type mix</h3>'+bars(kinds,KIND)+'</div>'+
 '<div class="glass hero" style="margin-top:14px"><h3 style="margin-top:0">Unit × paper heatmap</h3><p class="sub" style="font-size:13px">Number of questions from each unit in each paper (scroll sideways on phones).</p><div class="tbl"><table class="heat"><thead><tr><th>Paper</th>';
for (u=1; u<=8; u++) an += '<th style="color:'+ucol(u)+'">'+(u==8?"Oth":"U"+u)+'</th>';
an += '<th>Total</th></tr></thead><tbody>';
D.papers.slice().sort(function(a,c){return c.sort-a.sort;}).forEach(function(p){
  var row = perPaper[p.code]||{}, tot = 0;
  an += '<tr><td>'+esc(p.label)+'</td>';
  for (var k=1;k<=8;k++){ var v=row[k]||0; tot+=v; an += '<td style="background:rgba(124,156,255,'+(v?Math.min(.12+v*.12,.75):0)+')">'+(v||"·")+'</td>'; }
  an += '<td>'+tot+'</td></tr>';
});
an += '</tbody></table></div></div>'+
 '<div class="glass hero" style="margin-top:14px"><h3 style="margin-top:0">Papers analysed</h3><div class="tbl"><table><thead><tr><th>Paper</th><th>Type</th><th>Max marks</th><th>PDF pages</th><th>Questions</th></tr></thead><tbody>'+
 D.papers.slice().sort(function(a,c){return c.sort-a.sort;}).map(function(p){
   var n = 0; D.groups.forEach(function(g){ g.occ.forEach(function(o){ if(o[0]==p.code) n++; }); });
   return '<tr><td>'+esc(p.label)+'</td><td>'+p.kind+'</td><td>'+(p.max||"not printed")+'</td><td>'+esc(p.pages)+'</td><td>'+n+'</td></tr>';
 }).join("")+'</tbody></table></div>'+
 '<p class="sub" style="font-size:13px;margin-top:8px">Duplicate scans: pages 3–4, 7/11, 8/12, 42/44, 43/45 and the Feb 2024 paper (pages 1–2 and 5–6). Page 16 is blank.</p></div>'+
 '<div class="glass hero" style="margin-top:14px"><h3 style="margin-top:0">Pattern insights (2022–2025)</h3><ul class="ans">'+
 '<li>Format since 2022: 100 marks, Q1 compulsory 4 × 5 M + attempt 4 of Q2–Q7 (2 × 10 M each).</li>'+
 '<li><b>DFD design</b> appears in 14 of 20 papers – the most repeated question.</li>'+
 '<li><b>Golden rules of UI</b> appear in 14 papers; Unit 6 was missing only from Dec 2025.</li>'+
 '<li><b>Scrum</b> (11 papers) and <b>XP</b> (9) dominate Unit 2; <b>RAD</b> and <b>Waterfall</b> came back in each of 2024–25.</li>'+
 '<li>Unit 3 (UML) grew strongly: sequence, state, activity and class diagrams are designed in almost every recent paper.</li>'+
 '<li><b>ISO 9126</b> was asked in the last three finals; <b>V&V</b> in four consecutive papers until R25.</li>'+
 '<li>Estimation (FP, COCOMO), SCM, risk and W5HH have not appeared since 2019.</li></ul></div></section>';
H.push(an);

// ---------- DIAGRAMS ----------
var dre = /diagram|\bdfd\b|\bcfd\b|draw|figure|schematic|flow graph|control flow graph|layout|design (any one )?interface|design ui|user interface for/i;
var dmap = {};
D.groups.forEach(function(g){
  g.occ.forEach(function(o){
    if (!dre.test(o[2])) return;
    var name = g.dia;
    if (/interface|\bui\b|layout/i.test(o[2]) && g.unit==6) name = "User interface / screen design";
    if (!name) return;
    var e = dmap[name] = dmap[name] || {units:{}, papers:{}};
    e.units[g.unit] = 1; e.papers[o[0]] = 1;
  });
});
var dl = Object.keys(dmap).map(function(k){ var e=dmap[k]; return {name:k, units:Object.keys(e.units), papers:Object.keys(e.papers).sort(function(a,c){return P[a].sort-P[c].sort;})}; })
  .sort(function(a,c){ return c.papers.length-a.papers.length; });
H.push('<section id="diagrams"><h2>Diagram Analysis</h2><p class="sub">Every question whose wording asks you to draw, design or show a diagram. No diagrams are drawn here – only what to practise.</p>'+
 '<div class="tbl"><table><thead><tr><th>#</th><th>Diagram</th><th>Unit</th><th>Frequency</th><th>Years / papers</th></tr></thead><tbody>'+
 dl.map(function(e,i){ return '<tr class="drow"><td>'+(i+1)+'</td><td><b>'+esc(e.name)+'</b></td><td>'+e.units.map(function(u){return unitShort(u);}).join(", ")+'</td><td><span class="chip freq">×'+e.papers.length+'</span></td><td>'+e.papers.map(function(c){return esc(P[c].label);}).join(", ")+'</td></tr>'; }).join("")+
 '</tbody></table></div><div class="note">Frequency = number of different papers whose question explicitly asks for that diagram.</div></section>');

main.innerHTML = H.join("") + '<footer>Built from se_papers.pdf · '+D.papers.length+' papers · '+totalOcc+' question occurrences · works offline</footer>';

// ---------- behaviour ----------
// theme
var root = document.documentElement;
function setTheme(t){ root.setAttribute("data-theme", t); document.getElementById("theme").textContent = t==="dark" ? "☀" : "☾"; try{ localStorage.setItem("se-theme", t); }catch(e){} }
var saved = null; try{ saved = localStorage.getItem("se-theme"); }catch(e){}
setTheme(saved || "dark");
document.getElementById("theme").addEventListener("click", function(){ setTheme(root.getAttribute("data-theme")==="dark" ? "light" : "dark"); });

// unit filter
var curUnit = "all";
document.getElementById("unitfilter").addEventListener("click", function(ev){
  var t = ev.target.closest("button"); if(!t) return;
  if (t.id === "expandall"){ document.querySelectorAll("#bank details.q").forEach(function(d){ if(d.offsetParent!==null) d.open = true; }); return; }
  if (t.id === "collapseall"){ document.querySelectorAll("#bank details.q").forEach(function(d){ d.open = false; }); return; }
  curUnit = t.getAttribute("data-u");
  document.querySelectorAll("#unitfilter button[data-u]").forEach(function(x){ x.classList.toggle("on", x===t); });
  document.querySelectorAll("#bank .unitblock").forEach(function(blk){ blk.classList.toggle("hidden", curUnit!=="all" && blk.getAttribute("data-unit")!==curUnit); });
  applySearch();
});

// search
var qi = document.getElementById("q"), info = document.getElementById("searchinfo");
var items = Array.prototype.slice.call(document.querySelectorAll("details.q, .card.def, .card.rev, tr.drow, .linklist li"));
items.forEach(function(el){ el._txt = el.textContent.toLowerCase(); });
var timer = null;
function applySearch(){
  var v = qi.value.trim().toLowerCase();
  var terms = v ? v.split(/\s+/) : [];
  var shown = 0;
  items.forEach(function(el){
    var ok = !terms.length || terms.every(function(t){ return el._txt.indexOf(t) >= 0; });
    el.classList.toggle("hidden", !ok);
    if (ok && terms.length && el.matches("details.q") && el.closest("#bank")) shown++;
  });
  document.querySelectorAll("#bank .unitblock").forEach(function(blk){
    var any = blk.querySelector("details.q:not(.hidden)");
    blk.classList.toggle("hidden", (curUnit!=="all" && blk.getAttribute("data-unit")!==curUnit) || (terms.length>0 && !any));
  });
  if (terms.length){ info.style.display = "block"; info.textContent = shown+" matching question topic"+(shown===1?"":"s")+" in the bank · results filtered in every section"; }
  else info.style.display = "none";
}
qi.addEventListener("input", function(){ clearTimeout(timer); timer = setTimeout(applySearch, 120); });
qi.addEventListener("keydown", function(e){ if(e.key==="Enter"){ e.preventDefault(); var f = document.querySelector("#bank details.q:not(.hidden)"); if(f){ qi.blur(); f.open = true; f.scrollIntoView({behavior:"smooth",block:"start"}); } } });
document.getElementById("qclear").addEventListener("click", function(){ qi.value = ""; applySearch(); qi.focus(); });

// jump links that open a card
document.addEventListener("click", function(ev){
  var a = ev.target.closest("a[data-open]"); if(!a) return;
  ev.preventDefault();
  var id = a.getAttribute("data-open"), el = document.getElementById(id);
  if (!el) return;
  if (el.classList.contains("hidden") || (el.closest(".unitblock") && el.closest(".unitblock").classList.contains("hidden"))){
    qi.value = ""; curUnit = "all";
    document.querySelectorAll("#unitfilter button[data-u]").forEach(function(x){ x.classList.toggle("on", x.getAttribute("data-u")==="all"); });
    document.querySelectorAll("#bank .unitblock").forEach(function(b){ b.classList.remove("hidden"); });
    applySearch();
  }
  el.open = true;
  el.scrollIntoView({behavior:"smooth", block:"start"});
  try{ history.replaceState(null, "", "#"+id); }catch(e){}
});

// nav active state
var navLinks = Array.prototype.slice.call(document.querySelectorAll("#nav a"));
var secs = navLinks.map(function(a){ return document.getElementById(a.getAttribute("href").slice(1)); });
function onScroll(){
  var y = window.scrollY + 140, idx = 0;
  secs.forEach(function(s,i){ if (s && s.offsetTop <= y) idx = i; });
  navLinks.forEach(function(a,i){
    var on = i===idx;
    if (on && !a.classList.contains("active")){ a.classList.add("active"); var n=document.getElementById("nav"); var l=a.offsetLeft-n.clientWidth/2+a.clientWidth/2; n.scrollTo ? n.scrollTo({left:l,behavior:"smooth"}) : (n.scrollLeft=l); }
    else if (!on) a.classList.remove("active");
  });
  document.getElementById("totop").style.display = window.scrollY > 600 ? "block" : "none";
}
window.addEventListener("scroll", onScroll, {passive:true});
onScroll();
document.getElementById("totop").addEventListener("click", function(){ window.scrollTo({top:0, behavior:"smooth"}); });
})();

</script>
</body>
</html>
